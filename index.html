<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Deutsch Intensiv – allemand A1</title>
<meta name="description" content="Apprendre l’allemand, niveau A1 : leçons, exercices, écoute et prononciation.">
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#F6C700">
<meta name="mobile-web-app-capable" content="yes">
<link rel="icon" type="image/png" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Semi+Condensed:wght@500;600;700&family=Atkinson+Hyperlegible:wght@400;700&display=swap">
<style>
:root{
  --bg:#EDF0EC;--sf:#FFFFFF;--sf2:#F6F8F5;--ink:#14181A;--mu:#566067;--ln:#D2D8D1;
  --sign:#F6C700;--signink:#14181A;--pr:#14181A;--on:#FFFFFF;
  --ok:#0F766E;--okb:#DCF1EE;--no:#B3261E;--nob:#FADFDC;--warn:#8A5A00;--warnb:#FFF1C9;
  --der:#2A5FC1;--die:#C92C6B;--das:#2E8B57;
  --disp:"Barlow Semi Condensed","Arial Narrow",system-ui,sans-serif;
  --body:"Atkinson Hyperlegible",system-ui,-apple-system,"Segoe UI",sans-serif;
  box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  color-scheme:dark;--bg:#101416;--sf:#1A2023;--sf2:#20272B;--ink:#EDF1EE;--mu:#9BA7AD;--ln:#313A3F;
  --pr:#F6C700;--on:#14181A;--ok:#4FD1C5;--okb:#12332F;--no:#FF8A80;--nob:#40201D;--warn:#FFD466;--warnb:#3A2E0E;
  --der:#7FA8F5;--die:#F27BA9;--das:#6FCF97;}}
:root[data-theme="dark"]{
  color-scheme:dark;--bg:#101416;--sf:#1A2023;--sf2:#20272B;--ink:#EDF1EE;--mu:#9BA7AD;--ln:#313A3F;
  --pr:#F6C700;--on:#14181A;--ok:#4FD1C5;--okb:#12332F;--no:#FF8A80;--nob:#40201D;--warn:#FFD466;--warnb:#3A2E0E;
  --der:#7FA8F5;--die:#F27BA9;--das:#6FCF97;}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;min-height:100%;background:var(--bg);color:var(--ink);font:400 17px/1.5 var(--body)}
h1,h2,h3{font-family:var(--disp);font-weight:700;line-height:1.1;margin:0;letter-spacing:.005em}
h1{font-size:34px}h2{font-size:24px}h3{font-size:19px}
p{margin:0 0 10px}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid var(--sign);outline-offset:2px}
#app{max-width:640px;margin:0 auto;padding:16px 16px 150px}
.mu{color:var(--mu)}.sm{font-size:14.5px}.ctr{text-align:center}
.der{color:var(--der)}.die{color:var(--die)}.das{color:var(--das)}

/* plaque jaune : le panneau d'entrée de ville, signature de l'app */
.sign{display:inline-flex;align-items:baseline;gap:10px;background:var(--lc,var(--sign));color:var(--lk,var(--signink));border:3px solid var(--lk,var(--signink));border-radius:10px;padding:5px 13px 6px;font-family:var(--disp);font-weight:700;font-size:21px;line-height:1.1;box-shadow:0 0 0 3px var(--lc,var(--sign));margin:3px}
.sign small{font-weight:600;font-size:15px}
.plate{flex:none;width:42px;height:42px;margin:3px;border-radius:9px;background:var(--lc,var(--sign));color:var(--lk,var(--signink));border:2px solid var(--lk,var(--signink));box-shadow:0 0 0 3px var(--lc,var(--sign));display:grid;place-items:center;font:700 23px var(--disp)}
/* niveaux et modules : plaques d'autoroute (A1, A2) et de route fédérale (B1), numéro de sortie pour le module */
.shield{flex:none;display:grid;place-items:center;min-width:62px;height:42px;margin:3px;padding:0 10px;border-radius:9px;font:700 25px var(--disp);letter-spacing:.02em}
.shield.a{background:#1F4E9E;color:#fff;border:2px solid #fff;box-shadow:0 0 0 3px #1F4E9E}
.shield.b{background:var(--sign);color:#14181A;border:2px solid #14181A;box-shadow:0 0 0 3px var(--sign)}
.shield.sm{min-width:42px;height:28px;font-size:17px;padding:0 6px}
.exit{flex:none;width:46px;height:46px;border-radius:50%;background:var(--lc,var(--ink));color:var(--lk,#fff);display:grid;place-items:center;font:700 23px var(--disp)}
.exit.sm{width:32px;height:32px;font-size:17px}
.tile .grow{flex:1;min-width:0}
.mbar{display:block;height:6px;border-radius:6px;background:var(--ln);overflow:hidden;margin-top:7px}
.mbar i{display:block;height:100%;background:var(--lc,var(--ok));border-radius:6px}
.pc{font:700 17px var(--disp);flex:none}
.mods{display:grid;grid-template-columns:repeat(8,1fr);gap:6px;margin-top:10px}
.mods button{aspect-ratio:1;border-radius:50%;border:2px solid var(--ln);background:var(--sf);font:700 18px var(--disp);padding:0}
.mods button.on{background:var(--lc);color:var(--lk);border-color:var(--lc)}
details.md{border-top:1px solid var(--ln);padding:10px 0 8px}
details.md summary{display:flex;gap:12px;align-items:center;cursor:pointer;list-style:none}
details.md summary::-webkit-details-marker{display:none}
details.md summary b{display:block;font-family:var(--disp);font-size:17px;margin-bottom:5px}
input[type=number]{font:inherit;padding:8px;border-radius:8px;border:1px solid var(--ln);background:var(--sf);color:var(--ink)}

.btn{display:block;width:100%;border:0;border-radius:12px;padding:15px 16px;background:var(--pr);color:var(--on);font-family:var(--disp);font-weight:700;font-size:20px;text-align:center;box-shadow:0 4px 0 rgba(0,0,0,.28)}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 rgba(0,0,0,.28)}
.btn[disabled]{opacity:.38;cursor:default;box-shadow:none}
.btn.sec{background:var(--sf);color:var(--ink);border:2px solid var(--ln);box-shadow:0 3px 0 var(--ln)}
.btn.ok{background:var(--ok);color:#fff}.btn.no{background:var(--no);color:#fff}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .btn.ok,:root:not([data-theme="light"]) .btn.no{color:#101416}}
:root[data-theme="dark"] .btn.ok,:root[data-theme="dark"] .btn.no{color:#101416}
.link{background:none;border:0;padding:8px 0;color:var(--mu);text-decoration:underline;font-size:15px}
.panel{background:var(--sf);border:1px solid var(--ln);border-radius:14px;padding:16px;margin:14px 0}
.row{display:flex;gap:10px;align-items:center}.row>.grow{flex:1;min-width:0}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}

/* en-tête de jeu */
.hud{display:flex;justify-content:space-between;align-items:center;gap:10px}
.hud b{font-family:var(--disp);font-size:20px}
.chips{display:flex;gap:8px}
.chip{background:var(--sf);border:1px solid var(--ln);border-radius:99px;padding:4px 12px;font-family:var(--disp);font-weight:700;font-size:16px;white-space:nowrap}
.goal{margin:12px 0 4px}
.goal .gl{display:flex;justify-content:space-between;font-size:14.5px;color:var(--mu);margin-bottom:5px}
.gbar{height:12px;border-radius:9px;background:var(--ln);overflow:hidden}
.gbar i{display:block;height:100%;background:var(--sign);border-radius:9px;transition:width .4s}
.tile{display:flex;gap:12px;align-items:center;width:100%;text-align:left;background:var(--sf);border:2px solid var(--ln);border-radius:14px;padding:13px 14px;box-shadow:0 3px 0 var(--ln);margin-top:12px}
.tile:active{transform:translateY(2px);box-shadow:0 1px 0 var(--ln)}
.tile[disabled]{opacity:.55;box-shadow:none;cursor:default}
.tile .ic{font-size:26px;flex:none;width:34px;text-align:center}
.tile b{display:block;font-family:var(--disp);font-size:19px;line-height:1.15}
.tile small{color:var(--mu);font-size:14.5px}
.tile.hot{border-color:var(--signink);background:var(--sign);color:var(--signink);box-shadow:0 3px 0 var(--signink)}
.tile.hot small{color:var(--signink)}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:10px}
.tiles .tile{margin-top:0;padding:11px 12px;gap:8px}
.tiles .tile .ic{font-size:22px;width:28px}
.tiles .tile b{font-size:16.5px;line-height:1.15}.tiles .tile small{font-size:13.5px;line-height:1.25;display:block}

/* leçon repliable et parcours d'unités */
.ls{background:var(--sf);border:1px solid var(--ln);border-radius:16px;margin:16px 0;overflow:hidden}
.lh{display:flex;align-items:center;gap:12px;width:100%;padding:12px 14px;background:none;border:0;text-align:left}
.lh .lt{flex:1;min-width:0}.lh .lt b{display:block;font-family:var(--disp);font-size:20px;line-height:1.15}
.lh .lt small{color:var(--mu);font-size:14.5px}
.chev{color:var(--mu);font-size:20px}
.lb{padding:0 14px 16px}
.path{list-style:none;margin:4px 0 0;padding:0;position:relative}
.path::before{content:"";position:absolute;left:27px;top:24px;bottom:24px;width:3px;background:var(--ln)}
.u{position:relative;display:flex;gap:14px;align-items:center;width:100%;text-align:left;background:none;border:0;padding:7px 0}
.ring{flex:none;width:56px;height:56px;border-radius:50%;display:grid;place-items:center;font-size:24px;background:conic-gradient(var(--lc,var(--ok)) calc(var(--p)*1%),var(--ln) 0);position:relative}
.ring::after{content:"";position:absolute;inset:5px;border-radius:50%;background:var(--sf)}
.ring span{position:relative;z-index:1}
.ring.full{background:var(--lc,var(--sign))}.ring.full::after{background:var(--lc,var(--sign))}
.u .ut{flex:1;min-width:0}
.u b{display:block;font-family:var(--disp);font-size:18px;line-height:1.15}
.u small{color:var(--mu);font-size:14.5px}

.meter{height:10px;border-radius:9px;background:var(--ln);overflow:hidden;display:flex}
.meter i{display:block;height:100%}
.m1{background:#B9C2BC}.m2{background:var(--sign)}.m3{background:#59B3A9}.m4{background:var(--ok)}
.legend{display:flex;flex-wrap:wrap;gap:4px 14px;font-size:13.5px;color:var(--mu);margin-top:8px}
.legend b{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px}

/* mémo et fiches */
.memo{background:var(--sf);border:1px solid var(--ln);border-left:6px solid var(--sign);border-radius:12px;padding:14px 16px;margin:12px 0}
.memo p:last-child{margin-bottom:0}
.memo table,.fiche table{border-collapse:collapse;width:100%;margin:6px 0 10px;font-size:16px}
.memo td,.memo th{border-bottom:1px solid var(--ln);padding:5px 6px;text-align:left;vertical-align:top}
.memo th{font-family:var(--disp);font-weight:600;color:var(--mu)}
.fiche h3{margin:24px 0 4px}
.wl{list-style:none;margin:0;padding:0}
.wl li{display:grid;grid-template-columns:14px 1fr 1fr;gap:10px;padding:7px 0;border-top:1px solid var(--ln);align-items:baseline}
.wl li:first-child{border-top:0}
.wl .lv{width:10px;height:10px;border-radius:3px;background:var(--ln);align-self:center}
.wl .lv.l1{background:#B9C2BC}.wl .lv.l2{background:var(--sign)}.wl .lv.l3{background:#59B3A9}.wl .lv.l4{background:var(--ok)}
.wl .de{font-weight:700;cursor:pointer}.wl .fr{color:var(--mu)}
.abc{display:grid;grid-template-columns:repeat(auto-fill,minmax(78px,1fr));gap:6px;margin:10px 0}
.abc button{background:var(--sf);border:1px solid var(--ln);border-radius:8px;padding:6px 4px;text-align:center}
.abc b{font-family:var(--disp);font-size:20px;display:block}.abc span{font-size:13px;color:var(--mu)}

/* exercices */
.top{display:flex;gap:12px;align-items:center;margin-bottom:16px}
.x{background:none;border:0;font-size:24px;line-height:1;color:var(--mu);padding:6px 8px;margin-left:-8px}
.bar{flex:1;height:12px;background:var(--ln);border-radius:9px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--lc,var(--ok));border-radius:9px;transition:width .25s}
.cnt{font-family:var(--disp);font-weight:700;min-width:54px;text-align:right}
.head{color:var(--mu);font-size:15.5px;margin-bottom:6px}
.prompt{font-family:var(--disp);font-weight:600;font-size:28px;line-height:1.2;margin:0 0 6px}
.prompt .bl{display:inline-block;min-width:70px;border-bottom:3px solid var(--sign);text-align:center}
.sub{color:var(--mu);margin-bottom:10px}
.card{background:var(--sf);border:2px solid var(--ln);border-radius:16px;padding:22px 18px;margin:8px 0 14px;box-shadow:0 4px 0 var(--ln)}
.card .de{font-family:var(--disp);font-weight:700;font-size:32px;line-height:1.15}
.card .fr{font-size:19px;margin-top:8px}
.card .nt{color:var(--mu);font-size:15.5px;margin-top:10px}
.spk{background:var(--sf);border:1px solid var(--ln);border-radius:10px;padding:8px 14px;font-size:15px;font-family:var(--disp);font-weight:600}
.spk.big{padding:16px 22px;font-size:19px;border-width:2px;box-shadow:0 3px 0 var(--ln)}
.noaudio .spk,.noaudio .needaudio{display:none}
.opts{display:grid;gap:10px;margin-top:14px}
.opt{background:var(--sf);border:2px solid var(--ln);border-radius:12px;padding:14px;text-align:left;font-size:18px;box-shadow:0 3px 0 var(--ln)}
.opt.sel{border-color:var(--ink)}
.opt.good{border-color:var(--ok);background:var(--okb)}.opt.bad{border-color:var(--no);background:var(--nob)}
.ansline{min-height:58px;border-bottom:2px solid var(--ln);display:flex;flex-wrap:wrap;gap:8px;padding-bottom:10px;margin:14px 0 16px;align-content:flex-start}
.bank{display:flex;flex-wrap:wrap;gap:8px}
.tk{background:var(--sf);border:2px solid var(--ln);border-radius:10px;padding:9px 13px;font-size:18px;box-shadow:0 3px 0 var(--ln)}
.tk.used{visibility:hidden}
.blockmode .tk{display:block;width:100%;text-align:left}
.blockmode.bank,.blockmode.ansline{flex-direction:column}
.ti{width:100%;font:inherit;font-size:21px;padding:13px 14px;border:2px solid var(--ln);border-radius:12px;background:var(--sf);color:var(--ink);margin-top:14px}
.keys{display:flex;gap:8px;margin-top:8px}
.keys button{flex:1;background:var(--sf);border:1px solid var(--ln);border-radius:8px;padding:8px 0;font-size:18px}
.shake{animation:sh .28s}@keyframes sh{25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}
.hint{background:var(--warnb);color:var(--warn);border-radius:10px;padding:9px 12px;margin-top:10px;font-size:15.5px}
.mt{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}
.mt>div{display:grid;gap:10px;align-content:start}
.mb{background:var(--sf);border:2px solid var(--ln);border-radius:12px;padding:12px 8px;font-size:16.5px;text-align:center;min-height:54px;box-shadow:0 3px 0 var(--ln)}
.mb.sel{border-color:var(--ink);background:var(--warnb)}
.mb.ok{border-color:var(--ok);background:var(--okb);opacity:.5;box-shadow:none}
.back{display:inline-flex;align-items:center;gap:6px;background:var(--sf);border:2px solid var(--ln);border-radius:99px;padding:8px 16px 8px 12px;font-family:var(--disp);font-weight:600;font-size:16px;color:var(--ink);margin:10px 0 8px;box-shadow:0 2px 0 var(--ln)}
.back:active{transform:translateY(2px);box-shadow:none}
.tirow{display:flex;gap:8px;align-items:stretch;margin-top:14px}
.tirow .ti{margin-top:0;flex:1;min-width:0}
.micb{flex:none;width:58px;border:2px solid var(--ln);border-radius:12px;background:var(--sf);font-size:22px;box-shadow:0 3px 0 var(--ln)}
.micb.on{background:var(--nob);border-color:var(--no)}
#toast{position:fixed;left:50%;top:calc(58px + env(safe-area-inset-top,0px));transform:translate(-50%,-14px);background:var(--ink);color:var(--bg);padding:9px 16px;border-radius:99px;font-size:15px;font-weight:600;max-width:88vw;text-align:center;opacity:0;pointer-events:none;transition:opacity .2s,transform .2s;z-index:60;box-shadow:0 4px 14px rgba(0,0,0,.18)}
#toast.show{opacity:1;transform:translate(-50%,0)}
[hidden]{display:none!important}
html,body{max-width:100%;overflow-x:hidden}body{overflow-wrap:break-word}.card .de,.prompt,.ft .sol b,.opt,.heard,.auf li,.oc,.mo{overflow-wrap:anywhere}
.todo{list-style:none;margin:10px 0 0;padding:0}
.todo li{display:flex;gap:10px;align-items:flex-start;padding:9px 0;border-top:1px solid var(--ln)}
.todo li:first-child{border-top:0}
.todo .bx{flex:none;width:24px;height:24px;border:2px solid var(--ink);border-radius:7px;display:grid;place-items:center;font:700 14px var(--disp);margin-top:1px}
textarea.ta{resize:vertical;min-height:64px;line-height:1.35;font-size:19px}
.prompt.long{font-size:21px;line-height:1.35;font-weight:500}
.ft .in{max-height:62vh;overflow:auto}
.instr{margin:0 0 12px}.instr b{display:block;font-family:var(--disp);font-size:22px;line-height:1.2}.instr span{display:block;color:var(--mu);font-size:15px;margin-top:3px}
.player{display:flex;gap:12px;align-items:center;margin:0 0 14px}.player .btn{width:auto;padding:12px 20px}
.wbox{display:flex;flex-wrap:wrap;gap:8px;background:var(--sf2);border:2px dashed var(--ln);border-radius:12px;padding:10px 12px;margin:0 0 14px}
.wbox span{background:var(--sf);border:1px solid var(--ln);border-radius:8px;padding:4px 10px;font-weight:700}
.auf{margin:0;padding:0 0 0 26px}.auf li{padding:12px 0;border-top:1px solid var(--ln);line-height:1.9;font-size:18px}.auf li:first-child{border-top:0}
.auf li.ok::marker{color:var(--ok)}.auf li.ko::marker{color:var(--no)}
.auf select,.gi{font:inherit;font-size:17px;padding:6px 8px;border:2px solid var(--ln);border-radius:9px;background:var(--sf);color:var(--ink);max-width:100%}
.gi{width:150px}.gi.wide{width:100%;margin-top:4px}
.auf li.ok select,.auf li.ok .gi{border-color:var(--ok);background:var(--okb)}.auf li.ko select,.auf li.ko .gi{border-color:var(--no);background:var(--nob)}
.auf .q{display:block;font-weight:700;line-height:1.4}
.mco{display:flex;flex-wrap:wrap;gap:8px;margin-top:6px}
.mo{background:var(--sf);border:2px solid var(--ln);border-radius:10px;padding:8px 12px;font-size:16.5px;line-height:1.3;text-align:left}
.mo.sel{border-color:var(--ink);background:var(--warnb)}.mo.good{border-color:var(--ok);background:var(--okb)}.mo.bad{border-color:var(--no);background:var(--nob)}
.corr1{color:var(--ok);font-weight:700}
.syl{display:inline-flex;flex-wrap:wrap;gap:6px;vertical-align:middle}.syl i{font-style:normal;background:var(--sf2);border:1px solid var(--ln);border-radius:8px;padding:1px 9px;font-weight:700}
.gapw{font-family:var(--disp);font-weight:700;font-size:22px;letter-spacing:.04em}
.ft .sol b span{display:inline;font-size:inherit;color:inherit}.ft .sol b .wg{color:var(--ok)}.ft .sol b .wb{color:var(--no)}
.wbox.col{flex-direction:column}.wbox.col span{font-weight:400}
.gl{display:block;color:var(--mu);font-size:14.5px;font-weight:400;line-height:1.3}
.dw{cursor:pointer}.dw:active{background:var(--warnb)}
.tap{font-size:14px;color:var(--mu);margin:0 0 8px}
.emo{font-size:64px;line-height:1.15;display:inline-block}
.oc{background:var(--sf);border:2px solid var(--ln);border-radius:10px;padding:7px 11px;font-size:17px;line-height:1.3;box-shadow:0 2px 0 var(--ln);margin:3px 5px 3px 0;text-align:left}
.ordA{display:flex;flex-wrap:wrap;align-items:center;min-height:48px;border-bottom:2px solid var(--ln);padding:2px 0 6px;margin:2px 0 8px}
.ordB{display:flex;flex-wrap:wrap}
.ordA.blk,.ordB.blk{flex-direction:column;align-items:stretch}.ordA.blk .oc,.ordB.blk .oc{width:100%;margin-right:0}
.oend{font-size:20px;margin-left:2px}.art{font-weight:700;margin-right:8px}
.ltext{background:var(--sf);border:1px solid var(--ln);border-left:6px solid var(--sign);border-radius:12px;padding:12px 14px;margin:0 0 14px;font-size:18px;line-height:1.55}
.ltext b{display:block;font-family:var(--disp);font-size:20px;margin-bottom:4px}.ltext p{margin:0 0 8px}.ltext p:last-child{margin:0}
.pl1{background:var(--sf);border:2px solid var(--ink);border-radius:9px;padding:5px 12px;font:600 15.5px var(--disp);margin:0 6px 6px 0}.pl1[disabled]{opacity:.45}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.grid3 .btn{padding:11px 4px;font-size:16.5px}
.tiles .tile{min-height:94px;padding:10px 9px;gap:7px}.tiles .tile .ic{font-size:20px;width:24px;flex:none}.tiles .tile b{font-size:15px;line-height:1.2;letter-spacing:-.01em}
.chip.big{font-size:14px;padding-left:9px;padding-right:9px}
.opts.pic{display:grid;grid-template-columns:1fr 1fr;gap:10px}.opts.pic .opt{font-size:46px;line-height:1.2;text-align:center;padding:14px 6px;margin:0}
.mb.pic{font-size:34px;line-height:1.15;padding:6px}
.emo.sm{font-size:36px;vertical-align:middle}
.warnbox{display:block;background:var(--nob);border:1px solid var(--no);border-radius:10px;padding:10px 12px;color:var(--ink);line-height:1.4}
.hello{margin:8px 0 2px;color:var(--mu);font-size:15.5px}
.goal.hit .gbar i{background:var(--ok)}
.ft .sol .acq{color:var(--ok);font-weight:700}
details.cor{padding:12px 14px;margin:10px 0}details.cor summary{display:flex;justify-content:space-between;gap:10px;cursor:pointer;font-family:var(--disp);font-size:18px}
details.cor summary .good{color:var(--ok);font-weight:700}details.cor summary .bad{color:var(--no);font-weight:700}
details.panel summary{cursor:pointer;font-weight:700}
.seg{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin:14px 0}
.seg button{background:var(--sf);border:2px solid var(--ln);border-radius:10px;padding:9px 4px;font-family:var(--disp);font-weight:600;font-size:15px;line-height:1.15}
.seg button.on{border-color:var(--signink);background:var(--sign);color:var(--signink)}
.mk{display:inline-block;width:10px;height:10px;border-radius:3px;background:var(--ln);margin-right:4px}
.mk.g{background:var(--ok)}.mk.b{background:var(--no)}
.wl2 li{grid-template-columns:32px 1fr 1fr}
.wg{color:var(--ok)}.wb{color:var(--no);text-decoration:underline wavy;text-underline-offset:5px}
.heard{min-height:26px;margin:12px 0 0;color:var(--mu);font-size:16px}

#foot{position:fixed;left:0;right:0;bottom:0;z-index:20}
.ft{padding:12px 16px calc(12px + env(safe-area-inset-bottom,0px));background:var(--bg);border-top:1px solid var(--ln)}
.ft .in{max-width:640px;margin:0 auto}
.ft.ok{background:var(--okb)}.ft.no{background:var(--nob)}
.ft .ttl{font-family:var(--disp);font-weight:700;font-size:20px;display:flex;justify-content:space-between;gap:10px}
.ft.ok .ttl{color:var(--ok)}.ft.no .ttl{color:var(--no)}
.ft .sol{margin:4px 0 10px}.ft .sol b{font-size:19px}.ft .sol span{display:block;color:var(--mu);font-size:15.5px}

#nav{position:fixed;left:0;right:0;bottom:0;z-index:10;display:flex;background:var(--sf);border-top:1px solid var(--ln);padding-bottom:env(safe-area-inset-bottom,0px)}
#nav[hidden]{display:none}
#nav button{flex:1;background:none;border:0;padding:11px 4px 12px;font-family:var(--disp);font-weight:600;font-size:16px;color:var(--mu);border-top:3px solid transparent}
#nav button.on{color:var(--ink);border-top-color:var(--sign)}

/* fin de série, test */
.res{text-align:center;padding:22px 0 6px}
.res .em{font-size:54px;line-height:1}
.xp{display:inline-block;margin-top:10px;background:var(--sign);color:var(--signink);border:3px solid var(--signink);border-radius:10px;padding:4px 14px;font:700 24px var(--disp)}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:14px 0}
.stat{background:var(--sf);border:1px solid var(--ln);border-radius:12px;padding:10px 6px;text-align:center}
.stat b{display:block;font:700 22px var(--disp)}.stat small{color:var(--mu);font-size:13px}
.lights{display:grid;gap:10px;margin:14px 0}
.light{display:grid;grid-template-columns:18px 1fr auto;gap:12px;align-items:center;background:var(--sf);border:1px solid var(--ln);border-radius:12px;padding:12px 14px}
.light i{width:18px;height:18px;border-radius:50%}
.light i.r{background:#D64034}.light i.y{background:var(--sign)}.light i.g{background:#1FA06A}
.light b{font-family:var(--disp);font-size:18px}.light span{font-family:var(--disp);font-weight:700;font-size:20px}
.corr{list-style:none;margin:0;padding:0}
.corr li{padding:10px 0;border-top:1px solid var(--ln)}
.corr .q{font-weight:700}.corr .bad{color:var(--no)}.corr .good{color:var(--ok)}
.timer{font-family:var(--disp);font-weight:700;font-size:18px;min-width:52px;text-align:right}
textarea.io{width:100%;min-height:90px;font:13px/1.4 ui-monospace,monospace;border:1px solid var(--ln);border-radius:10px;padding:8px;background:var(--sf);color:var(--ink)}
select{font:inherit;padding:8px;border-radius:8px;border:1px solid var(--ln);background:var(--sf);color:var(--ink)}
.cf{position:fixed;top:-30px;z-index:50;pointer-events:none;width:10px;height:14px;border-radius:2px;animation:fall 2.2s ease-in forwards}
@keyframes fall{to{transform:translateY(108vh) rotate(600deg);opacity:.7}}
@media (prefers-reduced-motion:reduce){.shake{animation:none}.bar i,.gbar i{transition:none}.cf{display:none}}
</style>

<script id="contenu">
/* ======================================================================
   CONTENU — une leçon = des données. Ajouter une leçon ne touche pas au moteur.
   Une leçon est découpée en unités : une notion par unité.
   Types d'éléments :
     w   = mot ou expression         (relier → choisir / écouter → écrire)
     s   = phrase utile              (écouter et répéter → construire → écrire)
     g   = point de grammaire à trou (choisir → écrire)
     r   = savoir à reconnaître      (QCM, plusieurs variantes)
     num = nombre tiré au hasard     (choisir → écrire en lettres)
   ====================================================================== */
const ABC=[["A","a"],["B","bé"],["C","tsé"],["D","dé"],["E","é"],["F","èf"],["G","gué"],["H","ha"],["I","i"],["J","yot"],["K","ka"],["L","èl"],["M","èm"],["N","èn"],["O","o"],["P","pé"],["Q","kou"],["R","èr"],["S","ès"],["T","té"],["U","ou"],["V","faou"],["W","vé"],["X","iks"],["Y","upsilone"],["Z","tsèt"],["Ä","è"],["Ö","eu"],["Ü","u"],["ß","ès-tsèt"]];

const L1={
 id:"a1-01", n:1, title:"Hallo! Ich bin …", fr:"Saluer, se présenter, dire d’où l’on vient",
 bank:["bin","bist","ist","sind","komme","kommst","kommt","heiße","heißt","du","Sie","er","aus","der","wie","wer","woher","und","auch","nicht"],
 bankFr:["je","tu","il","elle","vous","suis","es","est","viens","vient","de","du","et","bien","merci","comment","qui","où","nom","aussi","Madame","Monsieur"],
 units:[
  {id:"al",ic:"🔤",title:"L’alphabet",de:"Das Alphabet",abc:1,
   memo:`<p>L’alphabet allemand a les 26 lettres du français, plus {ä}, {ö}, {ü} et {ß}. Touche une lettre du tableau pour l’entendre.</p><p>Lettres pièges pour un francophone : E se dit « é », I « i », G « gué », J « yot », V « faou », W « vé », Z « tsèt », U « ou », Y « upsilone ».</p><p>Dans les mots : <b>V</b> se prononce souvent « f » ({Vorname}), <b>W</b> « v » ({woher}), <b>J</b> « y » ({ja}), <b>Z</b> « ts » ({Schweiz}), <b>ß</b> « ss » ({heißen}).</p>`,
   say:[["Vorname","le prénom · le V se prononce « f »"],["woher","d’où · le W se prononce « v »"],["Schweiz","la Suisse · le Z se prononce « ts »"],["heißen","s’appeler · le ß se prononce « ss »"],["Österreich","l’Autriche · le Ö se prononce « eu »"],["Tschüs","salut · le Ü se prononce « u »"]],
   match:[{t:"Relie chaque lettre à sa prononciation",say:"l",p:[["E","é"],["I","i"],["V","faou"],["W","vé"],["Z","tsèt"]]},{t:"Relie chaque lettre à sa prononciation",say:"l",p:[["G","gué"],["J","yot"],["C","tsé"],["H","ha"],["ß","ès-tsèt"]]},{t:"Relie chaque lettre à sa prononciation",say:"l",p:[["U","ou"],["Ü","u"],["Ö","eu"],["Ä","è"],["Q","kou"]]}]},
  {id:"ab",ic:"✍️",title:"Épeler",de:"Buchstabieren",
   memo:`<p>Tu n’as pas compris ? {Wie bitte?} Pour demander d’épeler : {Buchstabieren Sie bitte.} Pour épeler : {Ich buchstabiere:} K-E-L-L-E-R.</p><p>Les quatre lettres propres à l’allemand s’épellent aussi : {ä} · {ö} · {ü} · {ß}, qu’on appelle « Eszett ». Elles changent le mot : {schon} (déjà) n’est pas {schön} (beau).</p><p>Exemples : {Müller} · {Schröder} · {Jäger} · {Weiß} · {Straße} (rue) · {Übung} (exercice) · {Grüße} (salutations) · {Mädchen} (fille). Ces mots ne sont pas tous de cette leçon : ils servent à entraîner l’oreille et l’écriture.</p>`,
   say:[["schön","beau · ö se prononce « eu »"],["Übung","exercice · ü se prononce « u »"],["Straße","rue · ß se prononce « ss »"],["Mädchen","fille · ä se prononce « è »"],["Grüße","salutations · ü et ß"],["Müller","un nom de famille courant"]]},
  {id:"in",ic:"🎵",title:"L’intonation",de:"Satzmelodie",
   memo:`<p>En allemand, la voix <b>descend ↘</b> à la fin d’une affirmation : {Ich heiße Lena.} Elle descend aussi dans une question en W, contrairement au français : {Wie heißt du?} · {Woher kommen Sie?}</p><p>La voix <b>monte ↗</b> dans une relance : {Und du?} · {Und Ihnen?} Elle monte aussi dans une question à laquelle on répond par oui ou non : {Kommst du aus Wien?}</p><p>Écoute ces exemples en touchant les mots, puis répète-les à voix haute.</p>`,
   say:[["Wie heißt du?","question en W : la voix descend"],["Und du?","relance : la voix monte"],["Woher kommen Sie?","question en W : la voix descend"],["Und Ihnen?","relance : la voix monte"]]},
  {id:"gr",ic:"👋",title:"Saluer et prendre congé",de:"Begrüßung und Abschied",
   memo:`<p><b>Arriver</b> : {Hallo} (familier) · {Guten Morgen} (matin) · {Guten Tag} (journée) · {Guten Abend} (soir).</p><p><b>Partir</b> : {Tschüs} (familier) · {Auf Wiedersehen} (formel) · {Gute Nacht} (avant de dormir).</p><p>Attention : {Guten Morgen}, {Guten Tag}, {Guten Abend}, mais {Gute Nacht}, sans n.</p><p>En Autriche et en Bavière on entend {Servus} et {Grüß Gott}, en Suisse {Grüezi}.</p>`,
   match:[{t:"Relie chaque moment à la bonne formule",say:"r",p:[["le matin","Guten Morgen"],["le soir, en arrivant","Guten Abend"],["avant de dormir","Gute Nacht"],["partir, formel","Auf Wiedersehen"],["partir, entre amis","Tschüs"]]}]},
  {id:"na",ic:"🪪",title:"Dire son nom",de:"Der Name",
   memo:`<p>{Ich heiße Lena.} · {Ich bin Lena.} · {Mein Name ist Lena Keller.}</p><p>{Wie heißt du?} (comment t’appelles-tu ?) · {Wer bist du?} (qui es-tu ?)</p><p>Lena = {der Vorname} · Keller = {der Familienname}.</p><p>Chaque nom allemand prend une majuscule et a un genre. Apprends-le avec son article : <b class="der">{der}</b> (masculin), <b class="die">{die}</b> (féminin), <b class="das">{das}</b> (neutre). Ces trois couleurs restent les mêmes partout.</p>`},
  {id:"ds",ic:"🤝",title:"du ou Sie ? Présenter quelqu’un",de:"du oder Sie?",
   memo:`<p>{du} : amis, famille, enfants. On utilise le prénom : {Wie heißt du, Lena?}</p><p>{Sie}, toujours avec une majuscule : adultes qu’on ne connaît pas, contexte formel. On dit {Herr} ou {Frau} + nom de famille : {Wie heißen Sie, Herr Brandt?}</p><p>Présenter quelqu’un : {Wer ist das?} – {Das ist Frau Keller.} · {Er heißt Jonas.} · {Sie heißt Amira.}</p><p>Ne confonds pas {sie} (elle) et {Sie} (vous).</p>`,
   match:[{t:"du ou Sie ? Relie chaque personne au bon pronom",say:"r",p:[["Frau Keller, une inconnue","Sie"],["Lena, une amie","du"],["Herr Brandt, ton professeur","Sie"],["un enfant","du"]]}]},
  {id:"la",ic:"🌍",title:"Les pays",de:"Länder",
   memo:`<p>La plupart des pays n’ont pas d’article : {Deutschland}, {Österreich}, {Frankreich}, {Spanien}, {Mexiko}.</p><p>Quelques-uns en ont un : {die Schweiz}, {die Türkei}, {der Iran}.</p><p>{Woher?} = d’où ? · {kommen aus} = venir de.</p>`,
   match:[{t:"Relie chaque ville à son pays",say:"lr",p:[["Berlin","Deutschland"],["Wien","Österreich"],["Bern","die Schweiz"],["Paris","Frankreich"],["Madrid","Spanien"]]}]},
  {id:"he",ic:"🧭",title:"Dire d’où l’on vient",de:"Herkunft",
   memo:`<p>{Woher kommst du?} / {Woher kommen Sie?} – {Ich komme aus Deutschland.}</p><p>Pays sans article : {aus Spanien}, {aus Mexiko}. Pays avec article, l’article change après aus : {die Schweiz} → {aus der Schweiz} · {die Türkei} → {aus der Türkei} · {der Iran} → {aus dem Iran}.</p><table><tr><th>1</th><th>2 = verbe</th><th>suite</th></tr><tr><td>{Woher}</td><td><b>{kommst}</b></td><td>{du?}</td></tr><tr><td>{Ich}</td><td><b>{komme}</b></td><td>{aus Österreich.}</td></tr></table><p>Le verbe conjugué est toujours en 2<sup>e</sup> position.</p>`,
   match:[{t:"Relie chaque pays à la bonne forme",say:"lr",p:[["Deutschland","aus"],["die Schweiz","aus der"],["der Iran","aus dem"],["Spanien","aus"],["die Türkei","aus der"]]}]},
  {id:"kj",ic:"⚙️",title:"Verbes et questions en W",de:"Verben und W-Fragen",
   memo:`<table class="cj"><tr><th></th><th>{kommen}</th><th>{heißen}</th><th>{sein}</th></tr><tr><td>{ich}</td><td>{komm<b>e</b>}</td><td>{heiß<b>e</b>}</td><td>{<b>bin</b>}</td></tr><tr><td>{du}</td><td>{komm<b>st</b>}</td><td>{heiß<b>t</b>}</td><td>{<b>bist</b>}</td></tr><tr><td>{er} / {sie}</td><td>{komm<b>t</b>}</td><td>{heiß<b>t</b>}</td><td>{<b>ist</b>}</td></tr><tr><td>{Sie}</td><td>{komm<b>en</b>}</td><td>{heiß<b>en</b>}</td><td>{<b>sind</b>}</td></tr></table><p>Terminaisons régulières : ich -e, du -st, er/sie -t, Sie -en. Avec heißen, « du » prend seulement -t, car le radical finit déjà par ß. Le verbe sein est irrégulier.</p><p>{Wer} = qui · {Wie} = comment · {Woher} = d’où. Après le mot en W vient toujours le verbe : {Wie heißen Sie?}</p>`,
   match:[{t:"kommen : relie le pronom à sa forme",say:"lrj",p:[["ich","komme"],["du","kommst"],["er","kommt"],["Sie","kommen"]]},{t:"sein : relie le pronom à sa forme",say:"lrj",p:[["ich","bin"],["du","bist"],["er","ist"],["Sie","sind"]]},{t:"heißen : relie le pronom à sa forme",say:"lrj",p:[["ich","heiße"],["du","heißt"],["sie (elle)","heißt"],["Sie (vous)","heißen"]]}]},
  {id:"be",ic:"🙂",title:"Demander des nouvelles",de:"Wie geht’s?",
   memo:`<p>{Wie geht’s?} (familier) · {Wie geht es dir?} (du) · {Wie geht es Ihnen?} (Sie)</p><p>😀 {sehr gut} · 🙂 {gut} · 😐 {es geht} · 🙁 {nicht so gut}</p><p>On renvoie la question : {Gut, danke.} {Und dir?} / {Und Ihnen?} – {Auch gut.}</p>`,
   match:[{t:"Relie chaque humeur à la réponse",say:"r",p:[["😀","sehr gut"],["🙂","gut"],["😐","es geht"],["🙁","nicht so gut"]]}]}
 ],

 tx:[
  {id:"x1",de:"Hallo, ich heiße Lena Keller. Ich komme aus Österreich. Und wer bist du?",fr:"Salut, je m’appelle Lena Keller. Je viens d’Autriche. Et toi, qui es-tu ?"},
  {id:"x2",de:"Guten Tag, mein Name ist Brandt. Ich komme aus Deutschland. Wie heißen Sie und woher kommen Sie?",fr:"Bonjour, mon nom est Brandt. Je viens d’Allemagne. Comment vous appelez-vous et d’où venez-vous ?"},
  {id:"x3",de:"Das ist Frau Delgado. Sie kommt aus Spanien. Und das ist Herr Yilmaz. Er kommt aus der Türkei.",fr:"C’est Madame Delgado. Elle vient d’Espagne. Et c’est Monsieur Yilmaz. Il vient de Turquie."},
  {id:"x4",de:"Guten Morgen, Herr Weber! Wie geht es Ihnen? – Danke, sehr gut. Und Ihnen, Frau Keller? – Auch gut, danke.",fr:"Bonjour, Monsieur Weber ! Comment allez-vous ? – Merci, très bien. Et vous, Madame Keller ? – Bien aussi, merci."},
  {id:"x5",de:"Hallo Jonas, wie geht’s? – Nicht so gut. Und dir? – Es geht. Wer ist das? – Das ist Amira. Sie kommt aus dem Iran.",fr:"Salut Jonas, comment ça va ? – Pas très bien. Et toi ? – Ça peut aller. Qui est-ce ? – C’est Amira. Elle vient d’Iran."},
  {id:"x6",de:"Mein Vorname ist Anna und mein Familienname ist Nowak. Ich komme aus der Schweiz. Und woher kommst du?",fr:"Mon prénom est Anna et mon nom de famille est Nowak. Je viens de Suisse. Et toi, d’où viens-tu ?"}

 bankFr:["je","tu","il","elle","nous","vous","suis","es","est","sommes","ai","as","a","avons","travaille","fais","habite","vis","pas","ne","un","une","deux","comme","chez","à","et","mais"],
 units:[
  {id:"b1",ic:"💼",title:"Les métiers (1)",de:"Berufe (1)",
   memo:`<p>{der Beruf} = le métier. Devant un métier, l’allemand ne met pas d’article : {Ich bin Lehrer.} · {Er ist Arzt.}</p><p>Beaucoup de noms de métiers en -er ne changent pas au pluriel : {der Lehrer} → {die Lehrer}.</p>`},
  {id:"b2",ic:"🏗️",title:"Les métiers (2) et le féminin en -in",de:"Berufe (2)",
   memo:`<p>Pour une femme, on ajoute <b>-in</b> : {der Lehrer} → {die Lehrerin} · {der Student} → {die Studentin} · {der Journalist} → {die Journalistin}.</p><p>Attention au tréma : {der Arzt} → {die Ärztin}.</p><p>Le féminin est toujours {die}.</p>`,
   match:[{t:"Relie chaque métier à son féminin",say:"lr",p:[["der Arzt","die Ärztin"],["der Lehrer","die Lehrerin"],["der Student","die Studentin"],["der Kellner","die Kellnerin"],["der Friseur","die Friseurin"]]}]},
  {id:"ar",ic:"🧰",title:"Travail et formation",de:"Arbeit und Ausbildung",
   memo:`<p>Trois verbes à tout faire : {arbeiten} (travailler), {machen} (faire), {haben} (avoir).</p><p>{eine Ausbildung machen} · {ein Praktikum machen} · {einen Job haben} · {eine Stelle haben}.</p><p>{arbeitslos} = sans emploi (arbeit + los, « sans travail »).</p>`},
  {id:"sp",ic:"🗣️",title:"Parler de son travail",de:"Über den Beruf sprechen",
   memo:`<p>{Was machen Sie beruflich?} / {Was machst du beruflich?} · {Was sind Sie von Beruf?}</p><p>{Ich bin Lehrerin.} · {Ich arbeite als Kellner.} · {Ich arbeite bei Solara.} · {Ich mache eine Ausbildung als Friseurin.} · {Ich habe einen Job als Verkäufer.}</p><table><tr><th>{als}</th><td>+ métier</td><td>{Ich arbeite als Journalistin.}</td></tr><tr><th>{bei}</th><td>+ entreprise</td><td>{Ich arbeite bei Solara.}</td></tr><tr><th>{in}</th><td>+ ville</td><td>{Ich lebe in Köln.}</td></tr></table>`,
   match:[{t:"Relie chaque préposition à ce qui la suit",say:"l",p:[["als","un métier"],["bei","une entreprise"],["in","une ville"]]}]},
  {id:"hs",ic:"⚙️",title:"haben et sein à toutes les personnes",de:"haben und sein",
   memo:`<table class="cj"><tr><th></th><th>{haben}</th><th>{sein}</th></tr><tr><td>{ich}</td><td>{habe}</td><td>{bin}</td></tr><tr><td>{du}</td><td>{<b>hast</b>}</td><td>{bist}</td></tr><tr><td>{er} / {sie}</td><td>{<b>hat</b>}</td><td>{ist}</td></tr><tr><td>{wir}</td><td>{haben}</td><td>{<b>sind</b>}</td></tr><tr><td>{ihr}</td><td>{habt}</td><td>{<b>seid</b>}</td></tr><tr><td>{sie} / {Sie}</td><td>{haben}</td><td>{<b>sind</b>}</td></tr></table><p>Nouveaux pronoms : {wir} (nous), {ihr} (vous, à plusieurs personnes qu’on tutoie), {sie} (ils, elles).</p><p>Attention : {du hast}, {er hat}, sans b.</p>`,
   match:[{t:"haben : relie le pronom à sa forme",say:"lrj",p:[["ich","habe"],["du","hast"],["er","hat"],["wir","haben"],["ihr","habt"]]},{t:"sein : relie le pronom à sa forme",say:"lrj",p:[["ich","bin"],["du","bist"],["er","ist"],["wir","sind"],["ihr","seid"]]}]},
  {id:"rg",ic:"🔧",title:"Verbes réguliers : machen, arbeiten, wohnen",de:"Verben",
   memo:`<table class="cj"><tr><th></th><th>{machen}</th><th>{arbeiten}</th></tr><tr><td>{ich}</td><td>{mach<b>e</b>}</td><td>{arbeit<b>e</b>}</td></tr><tr><td>{du}</td><td>{mach<b>st</b>}</td><td>{arbeit<b>est</b>}</td></tr><tr><td>{er} / {sie}</td><td>{mach<b>t</b>}</td><td>{arbeit<b>et</b>}</td></tr><tr><td>{wir}</td><td>{mach<b>en</b>}</td><td>{arbeit<b>en</b>}</td></tr><tr><td>{ihr}</td><td>{mach<b>t</b>}</td><td>{arbeit<b>et</b>}</td></tr><tr><td>{sie} / {Sie}</td><td>{mach<b>en</b>}</td><td>{arbeit<b>en</b>}</td></tr></table><p>{wohnen} et {leben} se conjuguent comme {machen}. Quand le radical finit par -t (arbeit-), on intercale un <b>e</b> : {du arbeitest}, {er arbeitet}, {ihr arbeitet}.</p>`,
   match:[{t:"machen : relie le pronom à sa forme",say:"lrj",p:[["ich","mache"],["du","machst"],["er","macht"],["wir","machen"]]},{t:"arbeiten : relie le pronom à sa forme",say:"lrj",p:[["ich","arbeite"],["du","arbeitest"],["er","arbeitet"],["wir","arbeiten"]]}]},
  {id:"fa",ic:"💍",title:"Situation de famille",de:"Familienstand",
   memo:`<p>{der Familienstand} : {verheiratet} (marié) · {geschieden} (divorcé) · {Single} (célibataire).</p><p>{Ich lebe allein.} · {Wir leben zusammen.}</p><p>{ein Kind} · {zwei Kinder} : {Ich habe ein Kind.} · {Wir haben zwei Kinder.}</p>`},
  {id:"ne",ic:"🚫",title:"La négation et quelques petits mots",de:"Negation",
   memo:`<p>{nicht} se place après le verbe conjugué : {Ich bin nicht verheiratet.} · {Sie wohnt nicht in Köln.} · {Ich arbeite nicht.}</p><p>{keine} + nom = pas de : {Ich habe keine Kinder.}</p><p>{richtig} ≠ {falsch} · {Ich glaube, das ist richtig.}</p>`},
  {id:"n1",ic:"🔢",title:"Les nombres de 0 à 10",de:"Zahlen: 0 bis 10",
   memo:`<p>{null} 0 · {eins} 1 · {zwei} 2 · {drei} 3 · {vier} 4 · {fünf} 5</p><p>{sechs} 6 · {sieben} 7 · {acht} 8 · {neun} 9 · {zehn} 10</p><p>Ces onze nombres servent à former tous les autres : apprends-les par cœur, à l’oreille comme à l’écrit.</p>`},
  {id:"n2",ic:"🔟",title:"Les nombres de 10 à 20",de:"Zahlen: 10 bis 20",
   memo:`<p>Après {zehn} 10 viennent {elf} 11 et {zwölf} 12, à apprendre par cœur.</p><p>De 13 à 19 : chiffre + zehn → {dreizehn} 13 · {vierzehn} 14 · {fünfzehn} 15 · {achtzehn} 18 · {neunzehn} 19.</p><p>Deux pièges : {sechzehn} 16, sans le s de sechs, et {siebzehn} 17, sans le en de sieben.</p><p>20 = {zwanzig}.</p>`},
  {id:"n3",ic:"💯",title:"Les nombres de 20 à 100",de:"Zahlen: 20 bis 100",
   memo:`<p>Après {zwanzig} 20, les dizaines se forment avec <b>zig</b> : {vierzig} 40 · {fünfzig} 50 · {achtzig} 80 · {neunzig} 90. Pièges : {dreißig} 30, avec ß · {sechzig} 60 · {siebzig} 70.</p><p>Les nombres composés se disent à l’envers du français : l’unité d’abord, puis <b>und</b>, puis la dizaine, en un seul mot. 24 = {vierundzwanzig} · 35 = {fünfunddreißig} · 99 = {neunundneunzig}.</p><p>Avec 1, on écrit <b>ein</b>, sans s : 21 = {einundzwanzig} · 61 = {einundsechzig}.</p><p>100 = {hundert} ou {einhundert}.</p>`},
  {id:"n4",ic:"🏦",title:"Au-delà de 100 : centaines, milliers, millions",de:"Zahlen über 100",
   memo:`<p>On dit les centaines, puis le reste, en un seul mot et sans « und » entre les deux : 250 = {zweihundertfünfzig} · 365 = {dreihundertfünfundsechzig} · 101 = {einhunderteins}.</p><p>Les milliers : 1 000 = {tausend} ou {eintausend} · 2 000 = {zweitausend} · 3 450 = {dreitausendvierhundertfünfzig}. Le nombre de milliers se lit comme un petit nombre : 25 000 = {fünfundzwanzigtausend} · 100 000 = {hunderttausend}.</p><p>{die Million} est un nom, écrit à part et avec une majuscule : 1 000 000 = {eine Million} · 2 000 000 = {zwei Millionen} · 1 500 000 = {eine Million fünfhunderttausend}.</p><p>Jusqu’à 999 999, tout s’écrit en un seul mot.</p>`},
  {id:"al",ic:"🎂",title:"Âge et domicile",de:"Alter und Wohnort",
   memo:`<p>{Wie alt bist du?} – {Ich bin vierundzwanzig Jahre alt.} On dit « être », pas « avoir ».</p><p>{Wo wohnst du?} – {Ich wohne in Berlin.} · {Wo} = où (lieu) ≠ {Woher} = d’où (origine).</p>`}
 ],

 tx:[
  {id:"x1",de:"Ich heiße Jonas Weber und bin achtundzwanzig Jahre alt. Ich komme aus Österreich, aber ich wohne in Berlin. Ich arbeite als Kellner.",fr:"Je m’appelle Jonas Weber et j’ai vingt-huit ans. Je viens d’Autriche, mais j’habite à Berlin. Je travaille comme serveur."},
  {id:"x2",de:"Das ist Frau Keller. Sie ist Ärztin und arbeitet in Köln. Sie ist verheiratet und hat zwei Kinder.",fr:"C’est Madame Keller. Elle est médecin et travaille à Cologne. Elle est mariée et a deux enfants."},
  {id:"x3",de:"Was machst du beruflich? – Ich mache eine Ausbildung als Friseurin. Und du? – Ich bin Student, aber ich habe einen Job als Verkäufer.",fr:"Que fais-tu dans la vie ? – Je fais une formation de coiffeuse. Et toi ? – Je suis étudiant, mais j’ai un job de vendeur."},
  {id:"x4",de:"Wir sind Lena und Malik. Wir sind nicht verheiratet, aber wir leben zusammen. Wir wohnen in Wien und haben keine Kinder.",fr:"Nous sommes Lena et Malik. Nous ne sommes pas mariés, mais nous vivons ensemble. Nous habitons à Vienne et n’avons pas d’enfants."},
  {id:"x5",de:"Wie alt bist du und wo wohnst du? – Ich bin dreiundzwanzig Jahre alt und wohne in Köln. Ich arbeite bei Solara.",fr:"Quel âge as-tu et où habites-tu ? – J’ai vingt-trois ans et j’habite à Cologne. Je travaille chez Solara."},
  {id:"x6",de:"Herr Brandt ist Ingenieur von Beruf. Er ist fünfundvierzig Jahre alt und geschieden. Er lebt allein in Berlin.",fr:"Monsieur Brandt est ingénieur de profession. Il a quarante-cinq ans et il est divorcé. Il vit seul à Berlin."}
 ],

const GEN=[{"id":"a1-03","n":3,"title":"Das ist meine Mutter.","fr":"Famille, possessifs mein et dein, questions oui / non, langues","tspec":{"w":[7,4,6],"s":[12,7,10],"k":[4,3,4]},"units":[{"id":"fam","ic":"👪","title":"La famille proche","memo":"<p>Les membres de la famille : {der Vater}, {die Mutter} → {die Eltern} (toujours au pluriel). {der Bruder}, {die Schwester} → {die Geschwister} (frères et sœurs).</p><p>Beaucoup de ces noms forment leur pluriel avec un tréma : {der Vater} → {die Väter}, {die Mutter} → {die Mütter}, {der Bruder} → {die Brüder}, {die Tochter} → {die Töchter}.</p><p>Pour présenter : {Das ist meine Mutter.} · {Das sind meine Eltern.}</p>","de":"Familie","match":[{"t":"Relie chaque nom à son pluriel","p":[["der Vater","die Väter"],["die Mutter","die Mütter"],["der Bruder","die Brüder"],["die Tochter","die Töchter"],["der Sohn","die Söhne"]],"say":"lr"}]},{"id":"gros","ic":"👵","title":"Grands-parents et entourage","memo":"<p>{der Großvater} = {der Opa} (familier) · {die Großmutter} = {die Oma} (familier) → {die Großeltern}.</p><p>{der Enkel} (petit-fils) · {die Enkelin} (petite-fille) : on retrouve le féminin en -in.</p><p>{der Freund} / {die Freundin} : ami(e), mais aussi petit(e) ami(e) selon le contexte.</p>","de":"Großeltern und Freunde"},{"id":"pos","ic":"🔑","title":"mein et dein","memo":"<table><tr><th></th><th>masculin, neutre</th><th>féminin, pluriel</th></tr><tr><td>{ich}</td><td>{mein Bruder}</td><td>{meine Schwester} · {meine Eltern}</td></tr><tr><td>{du}</td><td>{dein Bruder}</td><td>{deine Schwester} · {deine Eltern}</td></tr></table><p>On ajoute <b>-e</b> devant un nom féminin ou pluriel. C’est le nom possédé qui compte, pas la personne qui possède.</p>","de":"mein und dein","match":[{"t":"mein ou meine ? Relie chaque nom à la bonne forme","p":[["Vater","mein"],["Mutter","meine"],["Eltern","meine"],["Sohn","mein"],["Tochter","meine"]],"say":"lr"}]},{"id":"jn","ic":"❓","title":"Questions oui / non : ja, nein, doch","memo":"<p>Dans une question à laquelle on répond par oui ou non, le <b>verbe vient en premier</b> : {Ist das deine Frau?} · {Sprichst du Englisch?} · {Bist du verheiratet?}</p><table><tr><th>Question</th><th>Réponse</th></tr><tr><td>{Ist das deine Frau?}</td><td>{Ja, das ist meine Frau.} / {Nein, das ist nicht meine Frau.}</td></tr><tr><td>{Das ist nicht deine Frau?}</td><td>{Doch, das ist meine Frau.} / {Nein.}</td></tr></table><p>{Doch} correspond au « si » français : il contredit une question négative.</p>","de":"Ja, nein, doch"},{"id":"spr","ic":"🗣️","title":"Les langues et le verbe sprechen","memo":"<table class=\"cj\"><tr><th></th><th>{sprechen}</th></tr><tr><td>{ich}</td><td>{spreche}</td></tr><tr><td>{du}</td><td>{spr<b>i</b>chst}</td></tr><tr><td>{er} / {sie}</td><td>{spr<b>i</b>cht}</td></tr><tr><td>{wir}</td><td>{sprechen}</td></tr><tr><td>{ihr}</td><td>{sprecht}</td></tr><tr><td>{sie} / {Sie}</td><td>{sprechen}</td></tr></table><p>Verbe à changement de voyelle : <b>e → i</b> avec du et er / sie seulement.</p><p>{Welche Sprachen sprichst du?} – {Ich spreche sehr gut Deutsch.} · {Ich spreche gut Englisch.} · {Ich spreche ein bisschen Französisch.} Les langues s’écrivent avec une majuscule et sans article.</p>","de":"Sprachen","match":[{"t":"sprechen : relie le pronom à sa forme","p":[["ich","spreche"],["du","sprichst"],["er","spricht"],["wir","sprechen"],["ihr","sprecht"]],"say":"lrj"}]}],"items":[{"t":"w","id":"w-die-familie","u":"fam","de":"die Familie","fr":"la famille","em":"👨‍👩‍👧‍👦","pl":"die Familien"},{"t":"w","id":"w-der-vater","u":"fam","de":"der Vater","fr":"le père","pl":"die Väter"},{"t":"w","id":"w-die-mutter","u":"fam","de":"die Mutter","fr":"la mère","pl":"die Mütter"},{"t":"w","id":"w-die-eltern","u":"fam","de":"die Eltern","fr":"les parents","note":"Toujours au pluriel."},{"t":"w","id":"w-der-sohn","u":"fam","de":"der Sohn","fr":"le fils","pl":"die Söhne"},{"t":"w","id":"w-die-tochter","u":"fam","de":"die Tochter","fr":"la fille (de ses parents)","pl":"di ch, das ist mein Bruder. Er heißt Jonas und er ist Ingenieur.","fr":"Ce n’est pas ton frère, si ? – Si, c’est mon frère. Il s’appelle Jonas et il est ingénieur."},{"id":"x-meine-grosseltern-leben-in-itali","de":"Meine Großeltern leben in Italien. Mein Opa spricht Italienisch und meine Oma spricht auch sehr gut Deutsch.","fr":"Mes grands-parents vivent en Italie. Mon papi parle italien et ma mamie parle aussi très bien allemand."}],"hoer":[{"id":"h1","fr":"Deux amis regardent une photo de famille","lines":[["M","Wer ist das? Ist das deine Mutter?"],["F","Ja, das ist meine Mutter. Und das ist mein Vater."],["M","Und das? Ist das dein Bruder?"],["F","Nein, das ist nicht mein Bruder. Das ist mein Freund Malik."],["M","Und wo wohnen deine Eltern?"],["F","Sie wohnen in Wien."]],"tasks":[{"k":"rf","q":"Malik ist der Bruder.","a":false},{"k":"mc","q":"Wer ist Malik?","a":"Ein Freund.","o":["Der Bruder.","Der Vater."]},{"k":"mc","q":"Wo wohnen die Eltern?","a":"In Wien.","o":["In Berlin.","In Köln."]},{"k":"rf","q":"Der Vater wohnt in Berlin.","a":false}],"de":"Zwei Freunde sehen ein Familienbild."},{"id":"h2","fr":"Ewa parle des langues de sa famille","lines":[["F","Ich heiße Ewa. Ich komme aus der Schweiz. Ich spreche Deutsch, Französisch und ein bisschen Italienisch."],["F","Mein Mann kommt aus Spanien. Er spricht Spanisch und Englisch und ein bisschen Deutsch."]],"tasks":[{"k":"fill","q":"Ewa kommt aus der ___.","a":["Schweiz"]},{"k":"mc","q":"Welche Sprachen spricht Ewa?","a":"Deutsch, Französisch und ein bisschen Italienisch.","o":["Deutsch, Englisch und Spanisch.","Französisch und Spanisch."]},{"k":"rf","q":"Der Mann kommt aus Spanien.","a":true},{"k":"rf","q":"Der Mann spricht sehr gut Deutsch.","a":false}],"de":"Ewa spricht über Sprachen."},{"id":"h3","fr":"Lena pose des questions à Jonas","lines":[["F","Sprichst du Englisch, Jonas?"],["M","Ja, ich spreche gut Englisch."],["F","Und du sprichst nicht Französisch, oder?"],["M","Doch, ein bisschen."],["F","Bist du verh able est masculine en allemand, la chaise aussi.</p><p><b>{die Möbel}</b> (les meubles) s’emploie au pluriel.</p>","de":"Möbel"},{"id":"adj","ic":"✨","title":"Décrire un objet","memo":"<p>L’adjectif placé après « {ist} » ne s’accorde pas : {Der Tisch ist} <b>{schön}</b>. · {Die Lampe ist} <b>{schön}</b>.</p><p><b>{sehr}</b> {schön} (très beau) · <b>{zu}</b> {groß} (trop grand) · <b>{nicht}</b> {schlecht} (pas mal) · <b>{wirklich}</b> {schön} (vraiment beau).</p><p>Les contraires : {groß} ≠ {klein} · {lang} ≠ {kurz} · {schwer} ≠ {leicht} · {schön} ≠ {hässlich} · {teuer} ≠ {billig.}</p>","de":"Wie ist das?","match":[{"t":"Relie chaque adjectif à son contraire","p":[["groß","klein"],["lang","kurz"],["schwer","leicht"],["schön","hässlich"],["teuer","billig"]],"say":"lr"}]},{"id":"art","ic":"📌","title":"der, das, die — er, es, sie","memo":"<table><tr><th></th><th>article défini</th><th>pronom</th></tr><tr><td>masculin</td><td>{<b class=\"der\">der</b> Tisch}</td><td>{<b>er</b> kostet…}</td></tr><tr><td>neutre</td><td>{<b class=\"das\">das</b> Bett}</td><td>{<b>es</b> kostet…}</td></tr><tr><td>féminin</td><td>{<b class=\"die\">die</b> Lampe}</td><td>{<b>sie</b> kostet…}</td></tr></table><p>Le pronom reprend le genre du nom allemand, pas celui du français : {der Tisch} → <b>{er}</b>, même si « la table » est féminin en français.</p>","de":"der, das, die"},{"id":"geld","ic":"💶","title":"Prix et grands nombres","memo":"<p><b>{Was kostet}</b> {der Tisch?} / <b>{Wie viel kostet}</b> {der Tisch? – Er} <b>{kostet}</b> 150 {Euro.} · <b>{Das macht}</b> 9 {Euro} 95.</p><p>{teuer} (cher) ≠ <b>{günstig}</b> (avantageux) / <b>{billig}</b> (pas cher, parfois de mauvaise qualité).</p><p>Grands nombres : 100 = {hundert} · 200 = {zweihundert} · 350 = {dreihundertfünfzig} · 1 000 = {tausend} · 2 500 = {zweitausendfünfhundert} · 100 000 = {hunderttausend} · 1 000 000 = {eine Million.}</p>","de":"Preise und Zahlen"},{"id":"kauf","ic":"🛒","title":"Au magasin : demander un prix, donner son avi  heure, pas 4 h 30.</p>","de":"Die Uhrzeit"},{"id":"am","ic":"⏱️","title":"am, um et la place du verbe","memo":"<p><b>{am}</b> + jour ou moment : {am Montag, am Abend.} <b>{um}</b> + heure : {um drei Uhr, um halb vier.} Exception : <b>{in der}</b> {Nacht.}</p><p>Le verbe conjugué reste en <b>2<sup>e</sup> position</b>, même quand la phrase commence par un autre mot que le sujet : {Ich} <b>{habe}</b> {heute keine Zeit.} → {Heute} <b>{habe}</b> {ich keine Zeit.}</p><p>{wissen : ich} <b>{weiß}</b>, du <b>{weißt}</b>, {er} / {sie} <b>{weiß}</b>, {wir wissen, ihr wisst, sie wissen.}</p>","de":"am, um und das Verb"},{"id":"ver","ic":"🤝","title":"Proposer, accepter, refuser","memo":"<p>Proposer : <b>{Hast du}</b> {heute Abend} <b>{Zeit?}</b> · <b>{Gehen wir}</b> {ins Kino?} · <b>{Lust auf}</b> {Schwimmbad?}</p><p>Accepter : {Ja, klar.} · <b>{Gute Idee!}</b> · {Warum nicht?}</p><p>Refuser poliment : {Nein, leider nicht.} · {Ich kann leider nicht.} · {Tut mir leid, ich habe keine Lust.}</p><p>Fixer l’heure : <b>{Wann denn?}</b> – {Am Dienstag um drei.} · {Bis dann!}</p>","de":"Sich verabreden"},{"id":"div","ic":"✉️","title":"Écrire un message, autres mots","memo":"<p>Commencer un message : <b>{Liebe}</b> {Lena}, (à une femme) · <b>{Lieber}</b> {Jonas}, (à un homme). Terminer : <b>{Liebe Grüße}</b> (amical) · <b>{Herzliche Grüße}</b> (plus cordial).</p><p>{höflich} (poli) ≠ {<b>un</b>höflich} (impoli) : le préfixe un- donne le contraire.</p>","de":"Eine Nachricht schreiben"}],"items":[{"t":"w","id":"w-die-ausstellung","u":"ort","de":"die Ausstellung","fr":"l’exposition","pl":"die Ausstellungen"},{"t":"w","id":"w-die-bar","u":"ort","de":"die Bar","fr":"le bar","pl":"die Bars"},{"t":"w","id":"w-das-caf","u":"ort","de":"das Café","fr":"le café (le lieu)","pl":"die Cafés"},{"t":"w","id":"w-die-disco","u":"ort","de":"die Disco","fr":"la discothèque","alt":["boîte de nuit","disco"],"pl":"die Discos"},{"t":"w","id":"w-die-kneipe","u":"ort","de":"die Kneipe","fr":"le bistrot","alt":[  : voyager","memo":"<p>Beaucoup de verbes ont un préfixe qui se détache : {<b>ab</b>fahren}, {<b>an</b>kommen}, {<b>ein</b>steigen}, {<b>aus</b>steigen}, {<b>um</b>steigen}, {<b>ab</b>holen}.</p><p>Dans la phrase, le verbe se conjugue en 2<sup>e</sup> position et le préfixe part <b>à la fin</b> : {Der Zug} <b>{fährt}</b> {um acht Uhr} <b>{ab}</b>. · {Wann} <b>{kommst}</b> du <b>an</b>?</p>","de":"Trennbare Verben: Reisen","match":[{"t":"Relie chaque verbe à sa traduction","p":[["abfahren","partir"],["ankommen","arriver"],["einsteigen","monter"],["aussteigen","descendre"],["umsteigen","changer"]],"say":"l"}]},{"id":"tr2","ic":"🛒","title":"Les verbes séparables : le quotidien","memo":"<p>{<b>an</b>rufen} : {Ich} <b>{rufe}</b> {dich morgen} <b>an</b>. · {<b>ein</b>kaufen} : {Ich} <b>{kaufe}</b> {noch etwas} <b>{ein}</b>. · {<b>fern</b>sehen} : {Am Abend} <b>{sehe}</b> {ich} <b>{fern}</b>. · {<b>mit</b>bringen} : {Ich} <b>{bringe}</b> {Kuchen} <b>{mit}</b>.</p><p>Après un verbe de modalité, le verbe séparable reste entier, à la fin : {Ich kann dich} <b>{abholen}</b>.</p><p>Attention : <b>{bekommen}</b> ne se sépare pas (be- n’est jamais séparable).</p>","de":"Trennbare Verben: Alltag"},{"id":"tel","ic":"👋","title":"Se renseigner et prendre congé","memo":"<p>À la gare : <b>{Wo fährt der Zug nach Wien ab?}</b> – {Auf Gleis drei.} · {Entschuldigen Sie.}</p><p>Finir une conversation : <b>{Also dann}</b>, {auf Wiedersehen!} · {Gut, dann} <b>{bis morgen}</b>. · <b>{Bis bald!}</b> · <b>{Mach’s gut!}</b> · <b>{Pass auf dich auf!}</b></p>","de":"Auskunft und Abschied"}],"items":[{"t":"w","id":"w-das-verkehrsmittel","u":"vk1","de":"das Verkehrsmittel","fr":"le moyen de transport","pl":"die Verkehrsmittel"},{"t":"w","id":"w-der-zug","u":"vk1","de":"der Zug","fr":"le train","em":"🚆","pl":"die Züge"},{"t":"w","id":"w-der-bus","u":"vk1","de":"der Bus","fr":"le bus","alt":["autobus"],"em":"🚌","pl":"die Busse"},{"t":"w","id":"w-die-u-bahn","u":"vk1","de":"die U-Bahn","fr":"le métro","e gemacht?","fr":"Qu’as-tu fait hier ?"},{"t":"s","id":"s-letzte-woche-habe-ich-viel-gearbeitet","u":"zt","de":"Letzte Woche habe ich viel gearbeitet.","fr":"La semaine dernière, j’ai beaucoup travaillé."},{"t":"s","id":"s-die-party-ist-langweilig","u":"zt","de":"Die Party ist langweilig.","fr":"La fête est ennuyeuse."}],"dialogs":[["Was hast du gestern gemacht?","Ich habe lange geschlafen. Und du?","Ich habe gearbeitet und dann eingekauft.","Wirklich? Am Sonntag?"],["Hast du Lena angerufen?","Ja, wir haben lange telefoniert.","Hast du sie eingeladen?","Ja, sie kommt am Samstag."],["Was hast du heute gegessen?","Ich habe nur ein Brötchen gegessen.","Und was hast du getrunken?","Zwei Kaffee."]],"cur":1,"tx":[{"id":"x-was-hast-du-gestern-gemacht-ich-","de":"Was hast du gestern gemacht? – Ich habe von neun bis fünf Uhr gearbeitet.","fr":"Qu’as-tu fait hier ? – J’ai travaillé de neuf heures à cinq heures."},{"id":"x-am-abend-habe-ich-eine-e-mail-ge","de":"Am Abend habe ich eine E-Mail geschrieben und ich habe lange ferngesehen.","fr":"Le soir, j’ai écrit un e-mail et j’ai regardé la télévision longtemps."},{"id":"x-wir-haben-freunde-eingeladen-und","de":"Wir haben Freunde eingeladen und viel gelacht. Wir haben Wein getrunken und Kuchen gegessen.","fr":"Nous avons invité des amis et beaucoup ri. Nous avons bu du vin et mangé du gâteau."},{"id":"x-hast-du-frau-weber-angerufen-nei","de":"Hast du Frau Weber angerufen? – Nein, ich habe mein Zimmer aufgeräumt.","fr":"As-tu appelé Mme Weber ? – Non, j’ai rangé ma chambre."},{"id":"x-letzte-woche-habe-ich-viel-deuts","de":"Letzte Woche habe ich viel Deutsch gelernt. Ich habe täglich die Zeitung gelesen.","fr":"La semaine dernière, j’ai beaucoup appris l’allemand. J’ai lu le journal tous les jours."},{"id":"x-gestern-habe-ich-lange-geschlafe","de":"Gestern habe ich lange geschlafen. Ab elf Uhr habe ich eingekauft und ein Geschenk gekauft.","fr":"Hier, j’ai dormi longtemps. À partir de onze heures, j’ai fait les courses et acheté un cadeau."}],"hoer":[{"id":"h1","fr":"Un homme demande à une amie ce qu’elle a fait hier","lines":[["M","Hallo Anna! Was hast du gestern gemacht?"],["F","Ich habe von neun bis zwölf Deutsch gelernt."],["M","Und am Nachmittag?"],["F","Am Nachmittag habe ich eingekauft und mein Zimmer aufgeräumt."],["M","Und am Abend?"],["F","Am Abend habe ich Freunde getroffen. Wir haben viel gelacht."]],"tasks":[{"k":"mc","q":"Was hat Anna von neun bis zwölf gemacht?","a":"Sie hat Deutsch gelernt.","o":["Sie hat gearbeitet.","Sie hat geschlafen."]},{"k":"rf","q":"Am Nachmittag hat Anna eingekauft.","a":true},{"k":"rf","q":"Am Abend hat Anna ferngesehen.","a":false},{"k":"mc","q":"Am Abend hat Anna …","a":"Freunde getroffen.","o":["eine E-Mail geschrieben.","die Zeitung gelesen."]}],"de":"Ein Mann fragt: Was hast du gestern gemacht?"},{"id":"h2","fr":"Une femme raconte sa journée d’hier","lines":[["F","Gestern habe ich um sieben Uhr gefrühstückt. Ich habe einen Kaffee getrunken und die Zeitung gelesen."],["F","Von acht bis vier habe ich gearbeitet. Ich habe keine Pause gemacht."],["F","Am Abend habe ich lange telefoniert."]],"tasks":[{"k":"fill","q":"Die Frau hat um ___ Uhr gefrühstückt.","a":["7","sieben"]},{"k":"mc","q":"Was hat sie getrunken?","a":"Einen Kaffee.","o":["Einen Tee.","Milch."]},{"k":"rf","q":"Sie hat eine Pause gemacht.","a":false},{"k":"mc","q":"Was hat sie am Abend gemacht?","a":"Sie hat telefoniert.","o":["Sie hat ferngesehen.","Sie hat gelernt."]}],"de":"Eine Frau spricht über gestern."},{"id":"h3","fr":"Un homme raconte sa fête de samedi","lines":[["F","Was hast du am Samstag gemacht?"],["M","Ich habe eine Party gemacht. Ich habe zwanzig Freunde eingeladen."],["F","Toll! Was habt ihr gemacht?"],["M","Wir haben Musik gehört, getanzt und viel geredet."],["F","Und was habt ihr gegessen?"],["M","Ich habe Suppe gekocht und Kuchen gekauft."]],"tasks":[{"k":"fill","q":"Der Mann hat ___ Freunde eingeladen.","a":["20","zwanzig"]},{"k":"rf","q":"Sie haben Musik gehört.","a":true},{"k":"mc","q":"Was hat der Mann gekocht?","a":"Suppe.","o":["Fisch.","Reis."]},{"k":"rf","q":"Der Mann hat Kuchen gebacken.","a":false}],"de":"Ein Mann spricht über die Party."},{"id":"h4","fr":"Deux collègues font le point","lines":[["M","Hast du Frau Weber angerufen?"],["F","Ja, ich habe heute zweimal angerufen, aber sie arbeitet heute nicht."],["M","Und die E-Mail? Hast du die E-Mail geschrieben?"],["F","Nein, noch nicht. Ich habe die Rechnungen gesucht."],["M","Kein Problem."]],"tasks":[{"k":"mc","q":"Wie oft hat die Frau angerufen?","a":"Zweimal.","o":["Dreimal.","Nie."]},{"k":"rf","q":"Frau Weber arbeitet heute.","a":false},{"k":"rf","q":"Die Frau hat die E-Mail geschrieben.","a":false},{"k":"mc","q":"Was hat die Frau gesucht?","a":"Die Rechnungen.","o":["Den Schlüssel.","Das Handy."]}],"de":"Zwei Kollegen sprechen über die Arbeit."},{"id":"h5","fr":"Cinq personnes racontent ce qu’elles ont fait, une question par personne","tasks":[{"k":"rf","q":"Die Frau hat lange geschlafen.","a":true,"lines":[["F","Gestern habe ich lange geschlafen: von elf bis neun Uhr!"]]},{"k":"mc","q":"Was hat der Mann gekauft?","a":"Ein Buch.","o":["Einen Wein.","Eine Zeitung."],"lines":[["M","Ich habe ein Geschenk gekauft: ein Buch."]]},{"k":"mc","q":"Wie oft hat sie Sport gemacht?","a":"Dreimal.","o":["Zweimal.","Täglich."],"lines":[["F","Letzte Woche habe ich dreimal Sport gemacht."]]},{"k":"rf","q":"Der Mann hat ferngesehen.","a":false,"lines":[["M","Ich habe nicht ferngesehen. Ich habe Musik gehört."]]},{"k":"mc","q":"Was hat der Mann gegessen?","a":"Fisch mit Reis.","o":["Fleisch mit Kartoffeln.","Suppe."],"lines":[["F","Was hast du gegessen?"],["M","Ich habe Fisch mit Reis gegessen."]]}],"de":"Fünf Personen: Was haben sie gemacht?","seg":1}],"lesen":[{"id":"r1","de":"Mein Samstag","text":["Am Samstag habe ich lange geschlafen. Um zehn Uhr habe ich gefrühstückt und die Zeitung gelesen.","Ab elf Uhr habe ich eingekauft. Ich habe ein Geschenk gekauft: einen Wein.","Am Abend habe ich Freunde eingeladen. Wir haben gegessen, viel geredet und gelacht."],"tasks":[{"k":"fill","q":"Um ___ Uhr hat die Person gefrühstückt.","a":["10","zehn"]},{"k":"mc","q":"Was hat sie gelesen?","a":"Die Zeitung.","o":["Ein Buch.","Eine E-Mail."]},{"k":"mc","q":"Was ist das Geschenk?","a":"Ein Wein.","o":["Ein Buch.","Ein Kuchen."]},{"k":"rf","q":"Am Abend hat die Person ferngesehen.","a":false},{"k":"rf","q":"Die Freunde haben viel gelacht.","a":true}]},{"id":"r2","de":"Eine E-Mail an Lena","text":["Liebe Lena, letzte Woche habe ich viel gearbeitet: täglich von acht bis sechs.","Am Freitag habe ich Jonas getroffen. Wir haben einen Kaffee getrunken und lange geredet.","Am Sonntag habe ich mein Zimmer aufgeräumt und Deutsch gelernt. Und du? Was hast du gemacht? Liebe Grüße, Amira"],"tasks":[{"k":"mc","q":"Wer schreibt die E-Mail?","a":"Amira.","o":["Lena.","Jonas."]},{"k":"rf","q":"Amira hat letzte Woche viel gearbeitet.","a":true},{"k":"mc","q":"Wann hat Amira Jonas getroffen?","a":"Am Freitag.","o":["Am Sonntag.","Am Samstag."]},{"k":"mc","q":"Was haben Amira und Jonas getrunken?","a":"Einen Kaffee.","o":["Einen Tee.","Einen Wein."]},{"k":"rf","q":"Am Sonntag hat Amira ferngesehen.","a":false}]}],"qa":[[["Was hast du gestern gemacht?","Ich habe mein Zimmer aufgeräumt."],["Wann hast du gefrühstückt?","Um sieben Uhr."],["Wie lange hast du geschlafen?","Von elf bis sieben."],["Wer hat angerufen?","Deine Mutter hat angerufen."]],[["Was hast du gekauft?","Ein Fahrrad."],["Wo hast du gearbeitet?","Zu Hause."],["Warum hast du nicht angerufen?","Ich habe kein Handy."],["Wie oft hast du angerufen?","Dreimal."]]],"bank":["schläfst","schlafst","schläft","schlafe","schlaft","schlafen","lädst","ladest","lädt","laden","ladet","gemacht","gemachen","macht","gemachtet","gearbeitet","gearbeit","gearbeiten","arbeitet","gekauft","gekaufen","kauft","gekaufet","gelernt","gelernen","lernt","gelerntet","gespielt","gespielen","spielt","gespiel","gehört","gehören","hört","gehöret","gefrühstückt","frühstückt","gefrühstücken","gefrühgestückt","gelacht","gelachen","lacht","gelachet","geredet","geredt","gereden","redet","telefoniert","getelefoniert","telefonieren","getelefonieren","fotografiert","gefotografiert","fotografieren","gefotografieren","geschrieben","geschreibt","geschreiben","schrieben","gegessen","geesst","geessen","gegesst","getrunken","getrinkt","getrinken","trunken","gelesen","gelest","geliest"],"bankFr":["Qu’as-tu","fait","aujourd’hui","J’ai","travaillé","écrit","un","e-mail","De","neuf","heures","à","midi","partir","appris","l’allemand","As-tu","appelé","Madame","Weber","rangé","ma","chambre","hier","La","semaine","dernière","beaucoup","fête","est","ennuyeuse"]},{"id":"a1-12","n":12,"title":"Was ist denn hier passiert?","fr":"Saisons, mois, fêtes, passé composé avec sein","tspec":{"w":[8,5,7],"s":[9,5,8],"k":[6,4,5]},"units":[{"id":"jz","ic":"🍂","title":"Les saisons et « im »","memo":"<p>Les quatre saisons sont masculines : <b class=\"der\">{der}</b> {Frühling}, <b class=\"der\">{der}</b> {Sommer}, <b class=\"der\">{der}</b> {Herbst}, <b class=\"der\">{der}</b> {Winter.}</p><p>Trois prépositions de temps à ne pas confondre : <b>{im}</b> + saison ou mois ({im Sommer, im Oktober}) · <b>{am}</b> + jour ou moment ({am Montag, am Abend}) · <b>{um}</b> + heure ({um drei Uhr}).</p>","de":"Jahreszeiten","match":[{"t":"im, am ou um ? Relie chaque moment à sa préposition","p":[["Sommer","im"],["Montag","am"],["drei Uhr","um"],["Oktober","im"],["Abend","am"]],"say":"lr"}]},{"id":"mon","ic":"📅","title":"Les mois","memo":"<p>Les douze mois sont masculins et proches du français. On dit <b>{im}</b> {Januar}, <b>{im}</b> {Juli.}</p><p>Attention à l’orthographe : Jan<b>uar</b>, Feb<b>ruar</b>, {M<b>ä</b>rz}, Jun<b>{i}</b>, Jul<b>{i}</b>, {<b>Ok</b>tober}, {De<b>z</b>ember}.</p>","de":"Monate"},{"id":"fest","ic":"🎉","title":"Fêtes et célébrations","memo":"<p><b>{es gibt}</b> + accusatif = il y a : {Das Fest} <b>{gibt es seit}</b> 1950. · <b>{seit}</b> = depuis.</p><p>{anfangen} se sépare et change de voyelle : {Das Fest} <b>{fängt}</b> {um elf Uhr} <b>an</b>. Son contraire : {aufhören} → {Das Fest} <b>{hört}</b> {um zwei Uhr} <b>{auf}</b>.</p>","de":"Feste"},{"id":"ps1","ic":"🚶","title":"Le passé avec sein : les participes","memo":"<p>Les verbes qui expriment un <b>déplacement</b> forment leur passé avec <b>{sein}</b> : {Ich} <b>{bin}</b> {nach Berlin} <b>{gefahren}</b>.</p><table><tr><th>Infinitif</th><th>Participe</th></tr><tr><td>{gehen}</td><td>{ist gegangen}</td></tr><tr><td>{fahren}</td><td>{ist gefahren}</td></tr><tr><td>{fliegen}</td><td>{ist geflogen}</td></tr><tr><td>{kommen}</td><td>{ist gekommen}</td></tr><tr><td>{ankommen}</td><td>{ist angekommen}</td></tr><tr><td>{einsteigen}</td><td>{ist eingestiegen}</td></tr></table><p>{passieren} (se passer) prend aussi {sein : Was} <b>{ist}</b> hier <b>{passiert}</b>?</p>","de":"Perfekt mit sein"},{"id":"ps2","ic":"⚖️","title":"sein ou haben ?","memo":"<p><b>{sein}</b> : le sujet change de lieu ({gehen, fahren, fliegen, kommen, ankommen, einsteigen, springen}) ou quelque chose se produit ({passieren}).</p><p><b>{haben}</b> : tous les autres verbes, même s’ils décrivent une activité qui bouge ({tanzen, spielen, arbeiten}).</p><p>{Ich} <b>{bin}</b> {nach Köln gefahren und} <b>{habe}</b> {Karneval gefeiert.}</p>","de":"sein oder haben?"},{"id":"fs","ic":"🥳","title":"Parler d’une fête ou d’un voyage","memo":"<p>Présenter une fête : {Das Fest} <b>{heißt}</b>… · <b>{ist in}</b> {Köln} · <b>{dauert}</b> {drei Tage} · <b>{hat}</b> {viele Besucher} · <b>{gibt es seit}</b> 1950.</p><p>Raconter un voyage : <b>{Letztes Jahr}</b> {ist er in die Schweiz geflogen.} · {Er ist} <b>{vor}</b> {drei Monaten nach Deutschland gekommen} ({vor} + durée = il y a).</p>","de":"Über Feste und Reisen sprechen"},{"id":"perf","ic":"🧱","title":"Les formes des verbes de la leçon","memo":"<p>Chaque verbe s’apprend avec ses formes : le passé composé, c’est-à-dire l’auxiliaire <b>{hat}</b> ou <b>{ist}</b> suivi du participe (écris les deux mots), et, pour certains verbes, un présent irrégulier avec <b>du</b> et <b>{er} / {sie}</b>.</p><p>anfangen → <b>hat angefangen</b> · aufhören → <b>hat aufgehört</b> · feiern → <b>hat gefeiert</b> · dauern → <b>hat gedauert</b> · gefallen → <b>hat gefallen</b> · geben → <b>hat gegeben</b> · studieren → <b>hat studiert</b></p>","de":"Verbformen"}],"items":[{"t":"w","id":"w-die-jahreszeit","u":"jz","de":"die Jahreszeit","fr":"la saison","pl":"die Jahreszeiten"},{"t":"w","id":"w-der-fruehling","u":"jz","de":"der Frühling","fr":"le printemps","em":"🌸"},{"t":"w","id":"w-der-sommer","u":"jz","de":"der Sommer","fr":"l’été","em":"☀️"},{"t":"w","id":"w-der-herbst","u":"jz","de":"der Herbst","fr":"l’automne","em":"🍂"},{"t":"w","id":"w-der-winter","u":"jz","de":"der Winter","fr":"l’hiver","em":"⛄"},{"t":"g","id":"g-im-wir-fahren-sommer-nach-spanien","u":"jz","a":"im","o":["am","um"],"tip":"im + saison ou mois","c":[["Wir fahren ___ Sommer nach Spanien.","Nous allons en Espagne en été."],["Das Fest ist ___ Oktober.","La fête est en octobre."]]},{"t":"g","id":"g-am-das-fest-faengt-freitag-an","u":"jz","a":"am","o":["im","um"],"tip":"am + jour ou moment de la journée","c":[["Das Fest fängt ___ Freitag an.","La fête commence vendredi."]]},{"t":"g","id":"g-um-das-fest-faengt-elf-uhr-an","u":"jz","a":"um","o":["im","am"],"tip":"um + heure","c":[["Das Fest fängt ___ elf Uhr an.","La fête commence à onze heures."]]},{"t":"s","id":"s-im-fruehling-fahren-wir-gern-fahrrad","u":"jz","de":"Im Frühling fahren wir gern Fahrrad.","fr":"Au printemps, nous aimons faire du vélo."},{"t":"s","id":"s-im-winter-fahre-ich-gern-ski","u":"jz","de":"Im Winter fahre ich gern Ski.","fr":"En hiver, j’aime faire du ski."},{"t":"w","id":"w-der-januar","u":"mon","de":"der Januar","fr":"janvier"},{"t":"w","id":"w-der-februar","u":"mon","de":"der Februar","fr":"février"},{"t":"w","id":"w-der-maerz","u":"mon","de":"der März","fr":"mars"},{"t":"w","id":"w-der-april ":[{"t":"Relie chaque préposition à sa traduction","p":[["neben","à côté de"],["vor","devant"],["hinter","derrière"],["zwischen","entre"],["unter","sous"]],"say":"l"}]},{"id":"dat","ic":"🧩","title":"Le datif après ces prépositions","memo":"<p>Quand ces prépositions répondent à <b>{Wo?}</b> (pas de mouvement), l’article passe au <b>datif</b> :</p><table><tr><th></th><th>défini</th><th>indéfini</th></tr><tr><td>masculin, neutre</td><td>{neben <b>dem</b> Dom, <b>dem</b> Café}</td><td>{neben <b>einem</b> Dom}</td></tr><tr><td>féminin</td><td>{neben <b>der</b> Post}</td><td>{neben <b>einer</b> Post}</td></tr><tr><td>pluriel</td><td>{neben <b>den</b> Banke<b>n</b>}</td><td>{neben Banke<b>n</b>}</td></tr></table><p>Deux contractions : {in dem} = <b>{im}</b> · {an dem} = <b>{am}</b>. Au pluriel, le nom prend aussi un -n : {die Häuser} → {den Häuser}<b>n</b>.</p>","de":"Dativ","match":[{"t":"Nominatif → datif : relie chaque article à sa forme","p":[["der","dem"],["das","dem"],["die","der"],["ein","einem"],["eine","einer"]],"say":"lr"}]},{"id":"hil","ic":"🙋","title":"Demander de l’aide et son chemin","memo":"<p>Aborder poliment : <b>{Entschuldigen Sie bitte.}</b> · <b>{Kann ich Sie etwas fragen?}</b> · <b>{Haben Sie einen Moment Zeit?}</b> · <b>{Können Sie mir helfen?}</b></p><p>Demander : <b>{Wo finde ich}</b> {das Hotel?} · <b>{Ich suche}</b> {die Post.} · <b>{Kennen Sie}</b> {das Café?}</p><p>{helfen} change de voyelle : du {h<b>i</b>lfst}, {er} / {sie} {h<b>i</b>lft}.</p>","de":"Um Hilfe bitten"},{"id":"bes","ic":"🗺️","title":"Indiquer le chemin et remercier","memo":"<p>Indiquer : {Sie fahren} <b>{zuerst geradeaus}</b> {und} <b>{dann nach rechts}</b>. · {Sie} <b>{biegen}</b> {links} <b>{ab}</b>. · {Sie fahren} <b>{die zweite Straße}</b> {rechts.} · {Das ist} <b>{in der Nähe}</b>.</p><p>Si on ne sait pas : {Tut mir leid, ich bin auch} <b>{fremd}</b> hier. · {Ich bin nicht von hier.}</p><p>Remercier : {Sehr nett! Vielen Dank!} · {Ach so. Schade. Trotzdem: Dankeschön! – Bitte, gern.}</p>","de":"Den Weg beschreiben"},{"id":"perf","ic":"🧱","title":"Les formes des verbes de la leçon","memo":"<p>Chaque verbe s’apprend avec ses formes : le passé composé, c’est-à-dire l’auxiliaire <b>{hat}</b> ou <b>{ist}</b> suivi du participe (écris les deux mots), et, pour certains verbes, un présent irrégulier avec <b>du</b> et <b>{er} / {sie}</b>.</p><p>abbiegen → <b>ist abgebogen</b> · weiterfahren → <b>ist weitergefahren</b> · zurückfahren → <b>ist zurückgefahren</b> · wenden → <b>hat gewendet</b> · beschreiben → <b>hat beschrieben</b> · anmachen → <b>hat angemacht</b> · finden → <b>hat gefunden</b> · fragen → <b>hat gefragt</b> · helfen → <b>hat geholfen</b> · stimmen → <b>hat gestimmt</b></p>","de":"Verbformen"}],"items":[{"t":"w","id":"w-die-ampel","u":"st","de":"die Ampel","fr":"le feu (de circulation)","alt":["feu tricolore","feu rouge"],"em":"🚦","pl":"die Ampeln"},{"t":"w","id":"w-die-bank","u":"st","de":"die Bank","fr":"la banque","em":"🏦","pl":"die Banken"},{"t":"w","id":"w-die-bruecke","u":"st","de":"die Brücke","fr":"le pont","em":"🌉","pl":"die Brücken"},{"t":"w","id":"w-der-dom","u":"st","de":"der Dom","fr":"la cathédrale","em":"⛪","pl":"die Dome"},{"t":"w","id":"w-das-hotel","u":"st","de":"das Hotel","fr":"l’hôtel","em":"🏨","pl":"die Hotels"},{"t":"w","id":"w-die-stadtmitte","u":"st","de":"die Stadtmitte","fr":"le centre-ville","alt":["centre de la ville"]},{"t":"w","id":"w-der-stadtplan","u":"st","de":"der Stadtplan","fr":"le plan de la ville","em":"🗺️","emAlt":["der Plan"],"pl":"die Stadtpläne"},{"t":"w","id":"w-die-polizei","u":"st","de":"die Polizei","fr":"la police","em":"🚓"},{"t":"w","id":"w-die-post","u":"st","de":"die Post","fr":"la poste","em":"🏤"},{"t":"w","id":"w-das-zentrum","u":"st","de":"das Zentrum","fr":"le centre","pl":"die Zentren"},{"t":"w","id":"w-der-plan","u":"st","de":"der Plan","fr":"le plan","pl":"die Pläne"},{"t":"w","id":"w-der-weg","u":"weg","de":"der Weg","fr":"le chemin","pl":"die Wege"},{"t":"w","id":"w-der-k n dem Bahnhof."]},{"k":"mc","q":"Was ist hinter dem Café?","a":"Ein Hotel.","o":["Eine Bank.","Die Polizei."]},{"k":"rf","q":"Der Bahnhof ist in der Nähe.","a":false},{"k":"fill","q":"Die Person fährt ___ Kilometer mit dem Bus.","a":["2","zwei"]}]}],"qa":[[["Wo ist die Post?","Neben der Bank."],["Können Sie mir helfen?","Ja, gern. Was suchen Sie?"],["Kennen Sie das Hotel Adler?","Nein, ich bin auch fremd hier."],["Vielen Dank!","Bitte, gern."]],[["Ist das in der Nähe?","Ja, nur 200 Meter."],["Fahre ich hier links?","Nein, Sie fahren geradeaus."],["Was suchen Sie?","Ich suche den Dom."],["Wie viele Kilometer sind das?","Zwei Kilometer."]]],"bank":["neben","zwischen","über","unter","vor","hinter","in","auf","dem","der","den","einem","einer","ein","eine","im","am","an","Das","Hotel","ist","Dom","Die","Bank","Post","und","Café","Zentrum","hilfst","helfst","hilft","helfe","helft","helfen","Entschuldigen","Sie","bitte","Können","mir","Kann","ich","etwas","fragen","Haben","einen","Moment","Zeit","Wo","finde","suche","Kennen","fahren","zuerst","geradeaus","dann","nach","rechts","biegen","links","ab","zweite","Straße","Nähe","zwei","Kilometer","Wenden","zurück","sehen","schon","Tut"],"bankFr":["L’hôtel","est","à","côté","de","la","cathédrale","banque","entre","poste","et","Le","café","dans","centre","Excusez-moi","s’il","vous","plaît","Pouvez-vous","m’aider","Puis-je","demander","quelque","chose","Avez-vous","un","moment","instant","Où","trouver","Je","cherche","Connaissez-vous","allez","d’abord","tout","droit","puis","droite","tournez","gauche","prenez","deuxième","rue","C’est","près","roulez","deux","kilomètres","Faites","demi-tour","revenez","en","arrière","Ensuite","voyez","déjà","Désolé","ne","suis","pas","d’ici","non","plus","Très","aimable","Merci","beaucoup","Ah"]},{"id":"a1-14","n":14,"title":"Wie findest du Ottos Haus?","fr":"Logement, nature, possessifs sein et ihr","tspec":{"w":[6,4,5],"s":[9,5,8],"k":[6,4,5]},"units":[{"id":"hs1","ic":"🏠","title":"La maison","memo":"<p><b class=\"das\">{das}</b> {Haus} (la maison) ≠ <b class=\"die\">{die}</b> {Wohnung} (l’appartement). Les étages : <b class=\"das\">{das}</b> {Erdgeschoss} (le rez-de-chaussée), puis <b>{der erste Stock}</b>, {der zweite Stock}…</p><p>On dit <b>{im}</b> {Erdgeschoss}, <b>{im}</b> {ersten Stock}, <b>{im}</b> {Keller.}</p>","de":"Das Haus"},{"id":"zi","ic":"🚪","title":"Les pièces et leur place","memo":"<p>Presque toutes les pièces se forment avec <b class=\"das\">{das}</b> {Zimmer : das} {<b>Wohn</b>zimmer} (séjour), {das} {<b>Schlaf</b>zimmer} (chambre), {das} {<b>Kinder</b>zimmer}, {das} {<b>Arbeits</b>zimmer} (bureau).</p><p>Situer : <b>{vorn}</b> (devant) ≠ <b>{hinten}</b> (au fond) · <b>{oben}</b> (en haut) ≠ <b>{unten}</b> (en bas).</p>","de":"Die Zimmer","match":[{"t":"Relie chaque mot à son contraire","p":[["vorn","hinten"],["oben","unten"],["links","rechts"],["groß","klein"]],"say":"lr"}]},{"id":"mie","ic":"🔑","title":"Louer et habiter","memo":"<p><b class=\"die\">{die}</b> {Miete} = le loyer · <b class=\"der\">{der}</b> {Vermieter} = le propriétaire qui loue · {vermieten} = louer (donner en location).</p><p>Une annonce : 3 {Zimmer}, 60 {Quadratmeter, möbliert} (meublé) ou {leer} (vide), {gemütlich} (confortable, chaleureux).</p><p>{aussehen} se sépare : {Die Küche} <b>{sieht}</b> {toll} <b>{aus}</b>.</p>","de":"Mieten und Wohnen"},{"id":"nat","ic":"🌳","title":"Dans la nature","memo":"<p>Les paysages : <b class=\"der\">{der}</b> {Berg} (la montagne), <b class=\"der\">{der}</b> {Fluss} (le fleuve, la rivière), <b class=\"das\">{das}</b> {Meer} (la mer), <b class=\"der\">{der}</b> {Wald} (la forêt).</p><p>Pluriels avec tréma : {der Baum} → {die} {B<b>ä</b>ume} · {der Fluss} → {die} {Fl<b>ü</b>sse} · {der Wald} → {die} {W<b>ä</b>lder} · {die Stadt} → {die} {St<b>ä</b>dte}.</p>","de":"In der Natur"},{"id":"gen","ic":"✍️","title":"Ottos Haus : nom propre + s","memo":"<p>Pour dire à qui appartient quelque chose, on ajoute <b>-s</b> au prénom, sans apostrophe : <b>{Ottos}</b> {Haus} = {das Haus} <b>{von}</b> {Otto.} · <b>{Lenas}</b> {Garten} = {der Garten von Lena.}</p><p>Le possesseur vient en premier, et l’article du nom disparaît.</p>","de":"Ottos Haus"},{"id":"sei","ic":"👤","title":"sein et ihr : son, sa, ses","memo":"<p>En allemand, le possessif dépend d’abord du <b>possesseur</b> : <b>{sein}</b> pour un homme (Otto), <b>{ihr}</b> pour une femme (Lena).</p><table><tr><th></th><th>Otto</th><th>Lena</th></tr><tr><td>{der Garten}</td><td>{sein Garten}</td><td>{ihr Garten}</td></tr><tr><td>{das Haus}</td><td>{sein Haus}</td><td>{ihr Haus}</td></tr><tr><td>{die Küche}</td><td>{sein<b>e</b> Küche}</td><td>{ihr<b>e</b> Küche}</td></tr><tr><td>{die Kinder}</td><td>{sein<b>e</b> Kinder}</td><td>{ihr<b>e</b> Kinder}</td></tr></table><p>À l’accusatif masculin : {Ich mag sein}<b>en</b> {Garten} / {ihr}<b>en</b> {Garten.}</p>","de":"sein und ihr","match":[{"t":"sein ou ihr ? Relie chaque possesseur à la bonne forme","p":[["Otto + Haus","sein"],["Lena + Haus","ihr"],["Otto + Küche","seine"],["Lena + Küche","ihre"]],"say":"r"}]},{"id":"bew","ic":"🗣️","title":"Décrire un logement et donner son avis","memo":"<p>Décrire : {Das Haus} <b>{hat}</b> {sieben Zimmer.} · <b>{Im Erdgeschoss sind}</b> {drei Zimmer.} · <b>{Hier vorne links ist}</b> {die Küche.} · <b>{Da hinten ist}</b> {seine Garage.}</p><p>Donner son avis : {Ich} <b>{finde}</b> {das Haus interessant.} · {Den Garten} <b>{mag ich besonders}</b>. · {Das Bad} <b>{mag ich gar nicht}</b>. · {Die Küche} <b>{sieht toll aus}</b>.</p>","de":"Eine Wohnung beschreiben"},{"id":"perf","ic":"🧱","title":"Les formes des verbes de la leçon","memo":"<p>Chaque verbe s’apprend avec ses formes : le passé composé, c’est-à-dire l’auxiliaire <b>{hat}</b> ou <b>{ist}</b> suivi du participe (écris les deux mots), et, pour certains verbes, un présent irrégulier avec <b>du</b> et <b>{er} / {sie}</b>.</p><p>vermieten → <b>hat vermietet</b> · aussehen → <b>hat ausgesehen</b> · bezahlen → <b>hat bezahlt</
