s est en fait tout à fait normal."},{"id":"x-gibt-es-hier-auch-eine-bibliothe","de":"Gibt es hier auch eine Bibliothek? – Ja, die Bibliothek ist neben dem Rathaus, in der Nähe.","fr":"Y a-t-il aussi une bibliothèque ici ? – Oui, la bibliothèque est à côté de la mairie, tout près."}],"hoer":[{"id":"h1","fr":"Un journaliste interroge une habitante","lines":[["M","Entschuldigung, was gefällt Ihnen an dem Viertel?"],["F","Der Park gefällt mir sehr gut. Und der Markt am Samstag."],["M","Und was gefällt Ihnen nicht?"],["F","Es gibt leider nur wenige Geschäfte. Und es gibt kein Kino."],["M","Vielen Dank!"]],"tasks":[{"k":"mc","q":"Was gefällt der Frau?","a":"Der Park und der Markt.","o":["Die Geschäfte und das Kino.","Die Kirche und das Rathaus."]},{"k":"rf","q":"Im Viertel gibt es ein Kino.","a":false},{"k":"mc","q":"Wann ist der Markt?","a":"Am Samstag.","o":["Am Sonntag.","Am Freitag."]},{"k":"rf","q":"Es gibt viele Geschäfte.","a":false}],"de":"Ein Mann fragt eine Frau: Was gefällt Ihnen?"},{"id":"h2","fr":"Une femme demande de l’aide à un ami","lines":[["F","Kannst du mir helfen? Ich suche die Bibliothek."],["M","Ja, klar. Die Bibliothek ist neben dem Rathaus."],["F","Danke! Und gehört das Fahrrad dir?"],["M","Nein, das gehört mir nicht. Es gehört Jonas."],["F","Ach so."]],"tasks":[{"k":"mc","q":"Was sucht die Frau?","a":"Die Bibliothek.","o":["Das Rathaus.","Den Park."]},{"k":"mc","q":"Wo ist die Bibliothek?","a":"Neben dem Rathaus.","o":["Hinter der Kirche.","Im Park."]},{"k":"rf","q":"Das Fahrrad gehört dem Mann.","a":false},{"k":"mc","q":"Das Fahrrad gehört …","a":"Jonas.","o":["der Frau.","Lena."]}],"de":"Eine Frau fragt: Kannst du mir helfen?"},{"id":"h3","fr":"Un homme parle de son quartier","lines":[["M","Ich wohne seit zwei Jahren in Giesing. Das Viertel ist ganz normal, aber es gefällt mir."],["M","Es gibt einen Park, einen Spielplatz und viele Kneipen. Die Menschen sind nett."],["M","Nur meine Familie fehlt mir: Sie lebt in Spanien."]],"tasks":[{"k":"fill","q":"Der Mann wohnt seit ___ Jahren in Giesing.","a":["2","zwei"]},{"k":"rf","q":"Das Viertel gefällt ihm.","a":true},{"k":"mc","q":"Was gibt es im Viertel?","a":"Einen Park und viele Kneipen.","o":["Ein Schloss und einen Hafen.","Ein Kino und ein Theater."]},{"k":"mc","q":"Wo lebt die Familie?","a":"In Spanien.","o":["In Italien.","In Giesing."]}],"de":"Ein Mann spricht über sein Viertel."},{"id":"h4","fr":"Une guide présente la ville à des touristes","lines":[["F","Hier sehen Sie das Schloss. Es ist sehr alt. Hinter dem Schloss ist ein Park."],["F","Der Turm neben der Kirche ist auch sehr alt. Am Hafen gibt es einen Markt."],["F","Und in der Jugendherberge können Sie günstig schlafen."]],"tasks":[{"k":"mc","q":"Was ist hinter dem Schloss?","a":"Ein Park.","o":["Der Hafen.","Ein Markt."]},{"k":"mc","q":"Wo ist der Turm?","a":"Neben der Kirche.","o":["Am Hafen.","Im Park."]},{"k":"mc","q":"Wo gibt es einen Markt?","a":"Am Hafen.","o":["Am Schloss.","An der Kirche."]},{"k":"rf","q":"Die Jugendherberge ist teuer.","a":false}],"de":"Eine Frau zeigt die Stadt."},{"id":"h5","fr":"Cinq habitants, une question par habitant","tasks":[{"k":"rf","q":"Die Stadt gefällt dem Mann.","a":false,"lines":[["M","Die Stadt gefällt mir nicht. Sie ist zu groß."]]},{"k":"mc","q":"Das Buch gehört …","a":"ihr.","o":["mir.","ihm."],"lines":[["F","Das Buch gehört nicht mir. Es gehört ihr."]]},{"k":"rf","q":"Der Mann sagt Danke.","a":true,"lines":[["M","Ich danke Ihnen! Sie helfen mir sehr."]]},{"k":"mc","q":"Was gibt es nicht?","a":"Einen Spielplatz.","o":["Einen Kindergarten.","Einen Park."],"lines":[["F","Im Viertel gibt es einen Kindergarten, aber keinen Spielplatz."]]},{"k":"mc","q":"Was fehlt der Frau?","a":"Das Meer.","o":["Die Familie.","Der Park."],"lines":[["M","Was fehlt dir hier?"],["F","Das Meer fehlt mir."]]}],"de":"Fünf Personen im Viertel.","seg":1}],"lesen":[{"id":"r1","de":"Mein Viertel","text":["Ich heiße Amira und wohne in Giesing. Das Viertel gefällt mir sehr gut.","Es gibt einen Markt, eine Bibliothek und viele Restaurants. Der Park ist in der Nähe.","Nur ein Kino fehlt mir. Und es gibt leider nur wenige Geschäfte."],"tasks":[{"k":"mc","q":"Wo wohnt Amira?","a":"In Giesing.","o":["In Köln.","Im Zentrum."]},{"k":"rf","q":"Das Viertel gefällt Amira.","a":true},{"k":"mc","q":"Was gibt es im Viertel?","a":"Einen Markt und eine Bibliothek.","o":["Ein Kino und ein Theater.","Einen Hafen und ein Schloss."]},{"k":"mc","q":"Was fehlt Amira?","a":"Ein Kino.","o":["Ein Park.","Ein Markt."]},{"k":"rf","q":"Es gibt viele Geschäfte.","a":false}]},{"id":"r2","de":"Urlaub in Hamburg","text":["Lena macht Urlaub in Hamburg. Die Stadt gefällt ihr sehr gut.","Sie schläft in einer Jugendherberge am Hafen. Der Blick ist toll.","Sie hat das Rathaus und eine Kirche gesehen. Das Wetter ist leider nicht so gut."],"tasks":[{"k":"mc","q":"Wo macht Lena Urlaub?","a":"In Hamburg.","o":["In München.","In Wien."]},{"k":"mc","q":"Wo schläft sie?","a":"In einer Jugendherberge.","o":["In einem Hotel.","Bei Freunden."]},{"k":"rf","q":"Die Stadt gefällt Lena nicht.","a":false},{"k":"mc","q":"Was hat sie gesehen?","a":"Das Rathaus und eine Kirche.","o":["Das Schloss und den Turm.","Den Park und den Markt."]},{"k":"rf","q":"Das Wetter ist sehr gut.","a":false}]}],"qa":[[["Wie gefällt dir die Stadt?","Sie gefällt mir sehr gut."],["Wem gehört das Buch?","Es gehört mir."],["Gibt es hier einen Markt?","Ja, am Rathaus."],["Was fehlt in dem Viertel?","Ein Kino fehlt."]],[["Wo ist die Bibliothek?","Neben dem Park."],["Kann ich dir helfen?","Ja, danke. Das ist nett."],["Was gibt es in dem Viertel?","Viele Geschäfte und Restaurants."],["Wie ist das Wetter?","Es ist schön."]]],"bank":["mir","mich","ich","dir","dich","du","ihm","ihn","er","ihr","sie","uns","wir","euch","ihnen","gefällt","gefallt","gefällst","gefallen","gefällen","Das","gehört","hilft","danke","Viertel","sehr","gut","Meine","Familie","fehlt","Was","an","dem","nicht","ist","ganz","normal","finde","schon","okay","So","toll","es","auch","wieder","Gibt","hier","ein","Kino","viele","Kneipen","und","Restaurants","leider","nur","wenige","Geschäfte","gefallst"],"bankFr":["Ça","me","plaît","C’est","à","moi","l’aide","Je","te","remercie","Le","quartier","beaucoup","Ma","famille","manque","Qu’est-ce","qui","vous","dans","ne","pas","est","tout","fait","normal","trouve","bien","va","correct","Ce","n’est","si","génial","non","plus","Y","a-t-il","aussi","un","cinéma","ici","Il","a","de","bistrots","et","restaurants","n’y","malheureusement","que","peu","magasins"]},{"id":"a1-16","n":16,"title":"Wir haben hier ein Problem.","fr":"Hôtel, problèmes, rendez-vous, prépositions de temps","tspec":{"w":[7,4,6],"s":[7,4,6],"k":[5,3,4]},"units":[{"id":"ho","ic":"🏨","title":"À l’hôtel","memo":"<p>Dans la chambre : <b class=\"die\">{die}</b> {Dusche}, <b class=\"der\">{der}</b> {Fernseher}, <b class=\"die\">{die}</b> {Heizung} (le chauffage), <b class=\"die\">{die}</b> {Klimaanlage} (la climatisation), <b class=\"das\">{das}</b> {Handtuch} (la serviette).</p><p><b class=\"der\">{der}</b> {Gast} = le client de l’hôtel, l’invité. <b class=\"die\">{die}</b> {Stunde} = l’heure (durée) : {eine halbe Stunde} = une demi-heure.</p>","de":"Im Hotel"},{"id":"pr","ic":"🔧","title":"Signaler un problème : les mots","memo":"<p>Deux façons de dire que quelque chose ne marche pas : {Der Fernseher} <b>{ist kaputt}</b>. · {Die Heizung} <b>{funktioniert nicht}</b>.</p><p>Ce qu’on fait alors : <b>{Bescheid sagen}</b> (prévenir), {einen Techniker} <b>{schicken}</b> (envoyer), {etwas} <b>{reparieren}</b>. <b>{sofort}</b> = tout de suite.</p>","de":"Probleme"},{"id":"hi","ic":"🛎️","title":"Demander et proposer de l’aide","memo":"<p>Le client : {Entschuldigung}, <b>{können Sie mir helfen?}</b> · <b>{Wir haben hier ein Problem.}</b> · {Die Heizung} <b>{funktioniert nicht}</b>. · <b>{Es gibt kein}</b> {Handtuch.} · <b>{Eine Bitte noch}:</b> {Können Sie einen Föhn bringen?}</p><p>L’employé : <b>{Was kann ich für Sie tun?}</b> · <b>{Ich kümmere mich sofort darum.}</b> · {Ich komme sofort.}</p>","de":"Um Hilfe bitten"},{"id":"zt","ic":"⏳","title":"vor, nach, in, für : situer dans le temps","memo":"<p><b>{Wann?}</b> → <b>{vor}</b>, <b>{nach}</b>, <b>{in}</b> + datif : <b>{vor}</b> {einer Stunde} (il y a une heure) · <b>{nach}</b> {dem Essen} (après le repas) · <b>{in}</b> {einer Stunde} (dans une heure).</p><p><b>{Für wie lange?}</b> → <b>{für}</b> + accusatif : {für} <b>{einen}</b> {Tag} · {für} <b>{eine}</b> {Woche} · {für} <b>{ein}</b> {Jahr.}</p><table><tr><th></th><th>datif ({vor, nach, in})</th><th>accusatif ({für})</th></tr><tr><td>{der Monat}</td><td>{in <b>einem</b> Monat}</td><td>{für <b>einen</b> Monat}</td></tr><tr><td>{das Jahr}</td><td>{in <b>einem</b> Jahr}</td><td>{für <b>ein</b> Jahr}</td></tr><tr><td>{die Woche}</td><td>{in <b>einer</b> Woche}</td><td>{für <b>eine</b> Woche}</td></tr></table>","de":"vor, nach, in, für"},{"id":"tm","ic":"📅","title":"Fixer, déplacer, annuler un rendez-vous","memo":"<p>Annuler : {Ich kann leider} <b>{doch nicht}</b> {kommen.} · {einen Termin} <b>{absagen}</b>.</p><p>Déplacer : {Ich möchte den Termin} <b>{verschieben}</b>. · <b>{Können wir}</b> {den Termin verschieben?}</p><p>Proposer : {Am Montag habe ich Zeit.} · <b>{Passt dir das?}</b> · <b>{Passt es Ihnen}</b> {am Freitag?} · <b>{Wollen wir}</b> {am Samstag ins Kino gehen?} · {Hast du Lust?}</p>","de":"Termine"},{"id":"ent","ic":"🙇","title":"S’excuser, réagir, écrire une lettre","memo":"<p>S’excuser : {Tut mir leid, meine Uhr} <b>{ist kaputt}</b>. · {Entschuldigung, ich habe deine Straße} <b>{nicht gefunden}</b>.</p><p>Réagir : {Kein Problem!} · {Das macht doch nichts.} · {Schade.} · <b>{Wie dumm!}</b> · <b>{Seltsam.}</b> · <b>{Ach, wirklich?}</b></p><p>Lettre formelle : <b>{Sehr geehrte}</b> {Frau Keller}, / <b>{Sehr geehrter}</b> {Herr Brandt}, … <b>{Mit freundlichen Grüßen}</b></p>","de":"Sich entschuldigen"},{"id":"perf","ic":"🧱","title":"Les formes des verbes de la leçon","memo":"<p>Chaque verbe s’apprend avec ses formes : le passé composé, c’est-à-dire l’auxiliaire <b>{hat}</b> ou <b>{ist}</b> suivi du participe (écris les deux mots), et, pour certains verbes, un présent irrégulier avec <b>du</b> et <b>{er} / {sie}</b>.</p><p>ausmachen → <b>hat ausgemacht</b> · bringen → <b>hat gebracht</b> · funktionieren → <b>hat funktioniert</b> · reparieren → <b>hat repariert</b> · schicken → <b>hat geschickt</b> · sich kümmern → <b>hat sich gekümmert</b> · tun → <b>hat getan</b> · warten → <b>hat gewartet</b> · kennenlernen → <b>hat kennengelernt</b> · mitnehmen → <b>hat mitgenommen</b> · absagen → <b>hat abgesagt</b> · vereinbaren → <b>hat vereinbart</b> · verschieben → <b>hat verschoben</b> · passen → <b>hat gepasst</b></p>","de":"Verbformen"}],"items":[{"t":"w","id":"w-der-aufzug","u":"ho","de":"der Aufzug","fr":"l’ascenseur","pl":"die Aufzüge"},{"t":"w","id":"w-die-dusche","u":"ho","de":"die Dusche","fr":"la douche","em":"🚿","pl":"die Duschen"},{"t":"w","id":"w-der-fernseher","u":"ho","de":"der Fernseher","fr":"le téléviseur","alt":["télévision","télé"],"em":"📺","pl":"die Fernseher"},{"t":"w","id":"w-der-foehn","u":"ho","de":"der Föhn","fr":"le sèche-cheveux","pl":"die Föhne"},{"t":"w","id":"w-der-gast","u":"ho","de":"der Gast","fr":"le client (de l’hôtel), l’invité","alt":["hôte","client"],"pl":"die Gäste"},{"t":"w","id":"w-das-handtuch","u":"ho","de":"das Handtuch","fr":"la serviette (de toilette)","alt":["serviette","essuie-main"],"pl":"die Handtücher"},{"t":"w","id":"w-die-heizung","u":"ho","de":"die Heizung","fr":"le chauffage","pl":"die Heizungen"},{"t":"w","id":"w-die-klimaanlage","u":"ho","de":"die Klimaanlage","fr":"la climatisation","alt":["clim","climatiseur"],"pl":"die Klimaanlagen"},{"t":"w","id":"w-die-internetverbindung","u":"ho","de":"die Internetverbindung","fr":"la connexion Internet","pl":"die Internetverbindungen"},{"t":"w","id":"w-der-wecker","u":"ho","de":"der Wecker","fr":"le réveil","em":"⏰","pl":"die Wecker"},{"t":"w","id":"w-die-s -passen","u":"perf","a":"hat gepasst","o":["ist gepasst","hat gepassen","hat passen"],"tip":"passen → hat gepasst","c":[["passen → Perfekt: ___","convenir : passé composé"]]},{"t":"g","id":"g-nimmst-was-du-mit","u":"perf","a":"nimmst","o":["nehmst","nimmt","nehmen"],"tip":"mitnehmen : du nimmst … mit (e → i)","c":[["Was ___ du mit?","Qu’emportes-tu ?"],["Du ___ den Schlüssel mit.","Tu emportes la clé."]]},{"t":"g","id":"g-nimmt-er-den-koffer-mit","u":"perf","a":"nimmt","o":["nehmt","nimmst","nehmen"],"tip":"mitnehmen : er nimmt … mit (e → i)","c":[["Er ___ den Koffer mit.","Il emporte la valise."],["Sie ___ das Handy mit. (elle)","Elle emporte le portable."]]}],"dialogs":[["Entschuldigung, können Sie mir helfen?","Ja, was kann ich für Sie tun?","Die Heizung in Zimmer 12 funktioniert nicht.","Ich kümmere mich sofort darum."],["Ich kann am Freitag leider doch nicht.","Schade. Können wir den Termin verschieben?","Ja. Passt es dir am Samstag?","Ja, am Samstag habe ich Zeit."],["Tut mir leid, mein Wecker ist kaputt.","Ach, wirklich?","Ja! Er funktioniert nicht.","Das macht doch nichts."]],"cur":1,"tx":[{"id":"x-wir-haben-hier-ein-problem-die-h","de":"Wir haben hier ein Problem: Die Heizung ist kaputt und es gibt kein Handtuch.","fr":"Nous avons un problème ici : le chauffage est en panne et il n’y a pas de serviette."},{"id":"x-der-fernseher-funktioniert-nicht","de":"Der Fernseher funktioniert nicht. Können Sie bitte einen Techniker schicken? – Ich kümmere mich sofort darum.","fr":"La télévision ne fonctionne pas. Pouvez-vous envoyer un technicien, s’il vous plaît ? – Je m’en occupe tout de suite."},{"id":"x-der-techniker-kommt-in-einer-stu","de":"Der Techniker kommt in einer Stunde. Nach dem Essen funktioniert die Dusche sicher wieder.","fr":"Le technicien vient dans une heure. Après le repas, la douche fonctionnera sûrement de nouveau."},{"id":"x-ich-kann-leider-doch-nicht-komme","de":"Ich kann leider doch nicht kommen. Können wir den Termin verschieben? Passt es Ihnen am Freitag?","fr":"Je ne peux finalement pas venir, malheureusement. Pouvons-nous déplacer le rendez-vous ? Vendredi vous convient-il ?"},{"id":"x-entschuldigung-ich-habe-deine-st","de":"Entschuldigung, ich habe deine Straße nicht gefunden. – Das macht doch nichts.","fr":"Pardon, je n’ai pas trouvé ta rue. – Ce n’est pas grave."},{"id":"x-sehr-geehrte-frau-keller-ich-bra","de":"Sehr geehrte Frau Keller, ich brauche das Zimmer für eine Woche. Mit freundlichen Grüßen, Jonas Weber","fr":"Madame Keller, j’ai besoin de la chambre pour une semaine. Cordialement, Jonas Weber"}],"hoer":[{"id":"h1","fr":"Un client signale un problème à la réception","lines":[["M","Guten Abend. Wir haben hier ein Problem."],["F","Was kann ich für Sie tun?"],["M","Die Heizung im Zimmer zwölf funktioniert nicht. Es ist sehr kalt."],["F","Oh, das tut mir leid. Ich schicke sofort einen Techniker."],["M","Danke. Eine Bitte noch: Können Sie ein Handtuch bringen?"],["F","Natürlich. Ich kümmere mich darum."]],"tasks":[{"k":"mc","q":"Was ist das Problem?","a":"Die Heizung funktioniert nicht.","o":["Der Fernseher ist kaputt.","Es gibt keine Dusche."]},{"k":"fill","q":"Das Zimmer: Nummer ___","a":["12","zwölf"]},{"k":"rf","q":"Die Frau schickt einen Techniker.","a":true},{"k":"mc","q":"Was braucht der Mann noch?","a":"Ein Handtuch.","o":["Einen Föhn.","Einen Wecker."]}],"de":"Ein Gast hat ein Problem."},{"id":"h2","fr":"Lena déplace un rendez-vous au téléphone","lines":[["F","Hallo Jonas, hier ist Lena. Ich kann morgen leider doch nicht kommen."],["M","Schade. Was ist passiert?"],["F","Ich habe einen Termin. Können wir das Essen verschieben?"],["M","Ja, kein Problem. Passt dir Samstag?"],["F","Ja, Samstag passt mir gut. Um sieben?"],["M","Okay, bis Samstag!"]],"tasks":[{"k":"rf","q":"Lena kann morgen kommen.","a":false},{"k":"mc","q":"Warum kann Lena nicht kommen?","a":"Sie hat einen Termin.","o":["Sie ist krank.","Sie hat keine Lust."]},{"k":"mc","q":"Wann ist das Essen jetzt?","a":"Am Samstag um sieben.","o":["Am Freitag um sieben.","Am Samstag um acht."]},{"k":"rf","q":"Jonas sagt: Kein Problem.","a":true}],"de":"Lena verschiebt einen Termin."},{"id":"h3","fr":"Un homme décrit sa chambre d’hôtel","lines":[["M","Mein Zimmer im Hotel ist nicht gut. Die Klimaanlage ist kaputt und der Fernseher funktioniert nicht."],["M","Es gibt keinen Föhn und keinen Wecker. Aber die Dusche ist neu und der Aufzug funktioniert."],["M","Ich bleibe nur für eine Nacht."]],"tasks":[{"k":"mc","q":"Was ist kaputt?","a":"Die Klimaanlage.","o":["Die Dusche.","Der Aufzug."]},{"k":"rf","q":"Der Fernseher funktioniert.","a":false},{"k":"rf","q":"Die Dusche ist neu.","a":true},{"k":"mc","q":"Wie lange bleibt der Mann?","a":"Für eine Nacht.","o":["Für eine Woche.","Für einen Monat."]}],"de":"Ein Mann spricht über sein Hotelzimmer."},{"id":"h4","fr":"Un homme arrive en retard et s’excuse","lines":[["M","Entschuldigung! Ich bin nicht pünktlich."],["F","Was ist passiert?"],["M","Meine Uhr ist kaputt. Und ich habe deine Straße nicht gefunden."],["F","Wie dumm! Aber das macht doch nichts. Der Kurs fängt erst in einer halben Stunde an."],["M","Ach, wirklich? Super!"]],"tasks":[{"k":"rf","q":"Der Mann ist pünktlich.","a":false},{"k":"mc","q":"Was ist kaputt?","a":"Die Uhr.","o":["Das Handy.","Das Auto."]},{"k":"mc","q":"Wann fängt der Kurs an?","a":"In einer halben Stunde.","o":["In einer Stunde.","Vor einer Stunde."]},{"k":"rf","q":"Die Frau sagt: Das macht doch nichts.","a":true}],"de":"Ein Mann ist nicht pünktlich."},{"id":"h5","fr":"Cinq situations, une question par situation","tasks":[{"k":"rf","q":"Die Heizung funktioniert wieder.","a":true,"lines":[["F","Der Techniker ist vor einer Stunde gekommen. Jetzt funktioniert die Heizung wieder."]]},{"k":"fill","q":"Der Mann braucht das Zimmer für ___ Wochen.","a":["2","zwei"],"lines":[["M","Ich brauche das Zimmer für zwei Wochen."]]},{"k":"rf","q":"Der Mann hat Lust.","a":false,"lines":[["F","Wollen wir am Samstag ins Kino gehen?"],["M","Nein, ich habe keine Lust."]]},{"k":"mc","q":"Wann trinken sie einen Kaffee?","a":"Nach dem Kurs.","o":["Vor dem Kurs.","Am Abend."],"lines":[["M","Nach dem Kurs trinken wir einen Kaffee."]]},{"k":"mc","q":"Was möchte die Frau?","a":"Den Termin absagen.","o":["Den Termin vereinbaren.","Einen Techniker schicken."],"lines":[["F","Ich möchte den Termin absagen. Ich habe leider keine Zeit."]]}],"de":"Fünf Situationen.","seg":1}],"lesen":[{"id":"r1","de":"Eine Beschwerde","text":["Sehr geehrter Herr Brandt, ich bin seit gestern im Hotel Maritim.","Leider gibt es ein Problem: Die Dusche ist kaputt und die Heizung funktioniert nicht. Es ist sehr kalt.","Können Sie bitte sofort einen Techniker schicken? Mit freundlichen Grüßen, Anna Keller"],"tasks":[{"k":"mc","q":"Wer schreibt die Beschwerde?","a":"Anna Keller.","o":["Herr Brandt.","Der Techniker."]},{"k":"mc","q":"Seit wann ist sie im Hotel?","a":"Seit gestern.","o":["Seit einer Woche.","Seit heute."]},{"k":"rf","q":"Die Dusche funktioniert.","a":false},{"k":"rf","q":"Im Zimmer ist es kalt.","a":true},{"k":"mc","q":"Was möchte Frau Keller?","a":"Einen Techniker.","o":["Ein Handtuch.","Einen Föhn."]}]},{"id":"r2","de":"Eine Nachricht","text":["Hallo Malik, ich kann heute leider doch nicht kommen. Mein Auto ist kaputt.","Der Techniker kommt erst in zwei Stunden. Können wir den Termin verschieben?","Passt es dir am Freitag nach der Arbeit? Tut mir leid! Lena"],"tasks":[{"k":"rf","q":"Lena kommt heute.","a":false},{"k":"mc","q":"Was ist kaputt?","a":"Das Auto.","o":["Die Uhr.","Die Heizung."]},{"k":"fill","q":"Der Techniker kommt in ___ Stunden.","a":["2","zwei"]},{"k":"mc","q":"Wann passt es Lena?","a":"Am Freitag nach der Arbeit.","o":["Am Samstag.","Heute Abend."]},{"k":"rf","q":"Lena sagt: Tut mir leid.","a":true}]}],"qa":[[["Was kann ich für Sie tun?","Wir brauchen ein Handtuch."],["Wann kommt der Techniker?","In einer Stunde."],["Für wie lange brauchen Sie das Zimmer?","Für eine Woche."],["Passt es dir am Samstag?","Ja, am Samstag ft"},{"id":"st","ic":"⭐","title":"Rêves, musique et voyages","memo":"<p>{laufen} (courir, marcher) change de voyelle : du {l<b>äu</b>fst}, {er} / {sie} {l<b>äu</b>ft}. Au passé : {ist gelaufen. reisen} aussi prend {sein : ist gereist.}</p><p><b class=\"die\">{die}</b> {Welt} = le monde · {eine Weltreise} = un tour du monde.</p>","de":"Träume, Musik, Reisen"},{"id":"wo","ic":"💥","title":"Le verbe wollen","memo":"<table class=\"cj\"><tr><th></th><th>{wollen}</th></tr><tr><td>{ich}</td><td>{<b>will</b>}</td></tr><tr><td>du</td><td>{<b>willst</b>}</td></tr><tr><td>{er / sie}</td><td>{<b>will</b>}</td></tr><tr><td>{wir}</td><td>{wollen}</td></tr><tr><td>{ihr}</td><td>{wollt}</td></tr><tr><td>{sie / Sie}</td><td>{wollen}</td></tr></table><p>{wollen} = vouloir, avec force. Comme les autres verbes de modalité, il envoie l’infinitif à la fin : {Ich} <b>{will}</b> {Sänger} <b>{werden}</b>.</p><p><b>{unbedingt}</b> (absolument) ≠ <b>{auf keinen Fall}</b> (en aucun cas). « {möchte} » est plus poli que « {will} ».</p>","de":"wollen","match":[{"t":"wollen : relie le pronom à sa forme","p":[["ich","will"],["du","willst"],["wir","wollen"],["ihr","wollt"]],"say":"lrj"}]},{"id":"we","ic":"🌱","title":"Le verbe werden","memo":"<p><b>{werden}</b> = devenir. Il est irrégulier : {ich werde, du} <b>{wirst}</b>, {er} / {sie} <b>{wird}</b>, {wir werden, ihr werdet, sie werden.} Passé : {ist geworden.}</p><p>Comme après « {sein} », le nom de métier n’a pas d’article : {Sie} <b>{wird Ärztin}</b>. · {Ich will} <b>{Lehrer werden}</b>.</p>","de":"werden"},{"id":"mo","ic":"📱","title":"mit et ohne","memo":"<p><b>{mit}</b> (avec) est toujours suivi du <b>datif</b> : {mit} <b>{dem}</b> {Auto} · {mit} <b>{der}</b> {U}-Bahn · {mit} <b>{meinem}</b> {Bruder} · {mit} <b>{meiner}</b> {Schwester.}</p><p><b>{ohne}</b> (sans) est toujours suivi de l’<b>accusatif</b> : {ohne} <b>{meinen}</b> {Koffer} · {ohne} <b>{mein}</b> {Handy} · {ohne} <b>{meine}</b> {Kreditkarte.}</p>","de":"mit und ohne","match":[{"t":"mit ou ohne ? Relie chaque préposition au cas qu’elle demande","p":[["mit","+ datif"],["ohne","+ accusatif"],["für","+ accusatif"]],"say":"l"}]},{"id":"pl","ic":"🗣️","title":"Parler de ses projets et de ses souhaits","memo":"<p>Dire ce qu’on veut : {Ich} <b>{will unbedingt}</b> {noch Spanisch lernen.} · {Ich} <b>{möchte bald}</b> {heiraten.} · <b>{Vielleicht}</b> {mache ich eine Weltreise.} · {Ich will} <b>{auf keinen Fall}</b> {Politiker werden.}</p><p>Dire ce qui compte : <b>{Für mich sind}</b> {Familie und Freunde} <b>{besonders wichtig}</b>.</p>","de":"Pläne und Wünsche"},{"id":"perf","ic":"🧱","title":"Les formes des verbes de la leçon","memo":"<p>Chaque verbe s’apprend avec ses formes : le passé composé, c’est-à-dire l’auxiliaire <b>{hat}</b> ou <b>{ist}</b> suivi du participe (écris les deux mots), et, pour certains verbes, un présent irrégulier avec <b>du</b> et <b>{er} / {sie}</b>.</p><p>schaffen → <b>hat geschafft</b> · abschließen → <b>hat abgeschlossen</b> · anmelden → <b>hat angemeldet</b> · verdienen → <b>hat verdient</b> · werden → <b>ist geworden</b> · wollen → <b>hat gewollt</b> · heiraten → <b>hat geheiratet</b> · laufen → <b>ist gelaufen</b> · reisen → <b>ist gereist</b> · putzen → <b>hat geputzt</b></p>","de":"Verbformen"}],"items":[{"t":"w","id":"w-das-ausland","u":"ab","de":"das Ausland","fr":"l’étranger (les autres pays)"},{"t":"w","id":"w-die-chance","u":"ab","de":"die Chance","fr":"la chance, l’occasion","alt":["opportunité"],"pl":"die Chancen"},{"t":"w","id":"w-die-fremdsprache","u":"ab","de":"die Fremdsprache","fr":"la langue étrangère","pl":"die Fremdsprachen"},{"t":"w","id":"w-das-geld","u":"ab","de":"das Geld","fr":"l’argent","em":"💰"},{"t":"w","id":"w-die-pruefung","u":"ab","de":"die Prüfung","fr":"l’examen","pl":"die Prüfungen"},{"t":"w","id":"w-eine-pruefung-schaffen","u":"ab","de":"eine Prüfung schaffen","fr":"réussir un examen"},{"t":"w","id":"w-abschliessen","u":"ab","de":"abschließen","fr":"terminer, achever","alt":["finir","conclu h-will-sa","de":"Was willst du werden? – Ich will Sängerin werden und im Ausland studieren.","fr":"Que veux-tu devenir ? – Je veux devenir chanteuse et étudier à l’étranger."},{"id":"x-ich-will-unbedingt-den-fuehrersc","de":"Ich will unbedingt den Führerschein machen, aber ich will auf keinen Fall ein Motorrad kaufen.","fr":"Je veux absolument passer le permis, mais je ne veux en aucun cas acheter une moto."},{"id":"x-mein-bruder-wird-arzt-er-will-vi","de":"Mein Bruder wird Arzt. Er will viel Geld verdienen und bald heiraten.","fr":"Mon frère devient médecin. Il veut gagner beaucoup d’argent et se marier bientôt."},{"id":"x-ich-reise-nie-ohne-meine-kreditk","de":"Ich reise nie ohne meine Kreditkarte. Im Sommer fahre ich mit meiner Schwester nach Italien.","fr":"Je ne voyage jamais sans ma carte de crédit. En été, je vais en Italie avec ma sœur."},{"id":"x-vielleicht-mache-ich-eine-weltre","de":"Vielleicht mache ich eine Weltreise. Für mich sind Familie und Freunde aber besonders wichtig.","fr":"Je ferai peut-être un tour du monde. Mais pour moi, la famille et les amis sont particulièrement importants."},{"id":"x-wir-wollen-die-pruefung-schaffen","de":"Wir wollen die Prüfung schaffen und dann eine Fremdsprache lernen.","fr":"Nous voulons réussir l’examen, puis apprendre une langue étrangère."}],"hoer":[{"id":"h1","fr":"Deux amis parlent de leur avenir","lines":[["F","Was willst du werden, Jonas?"],["M","Ich will Politiker werden."],["F","Wirklich? Ich will auf keinen Fall Politikerin werden!"],["M","Und was willst du werden?"],["F","Ich werde Ärztin. Ich will im Ausland studieren."],["M","Toll!"]],"tasks":[{"k":"mc","q":"Was will Jonas werden?","a":"Politiker.","o":["Sänger.","Arzt."]},{"k":"rf","q":"Die Frau will Politikerin werden.","a":false},{"k":"mc","q":"Was wird die Frau?","a":"Ärztin.","o":["Lehrerin.","Sängerin."]},{"k":"mc","q":"Wo will sie studieren?","a":"Im Ausland.","o":["In Köln.","Zu Hause."]}],"de":"Zwei Freunde sprechen über die Zukunft."},{"id":"h2","fr":"Une femme parle de ses souhaits","lines":[["F","Ich habe viele Wünsche. Ich will unbedingt den Führerschein machen."],["F","Ich möchte eine Weltreise machen, aber ich habe kein Geld."],["F","Ich will auf keinen Fall heiraten. Für mich sind Freunde besonders wichtig."]],"tasks":[{"k":"mc","q":"Was will die Frau unbedingt machen?","a":"Den Führerschein.","o":["Eine Prüfung.","Eine Ausbildung."]},{"k":"rf","q":"Die Frau hat viel Geld.","a":false},{"k":"rf","q":"Die Frau will heiraten.","a":false},{"k":"mc","q":"Was ist für sie wichtig?","a":"Freunde.","o":["Geld.","Der Beruf."]}],"de":"Eine Frau spricht über ihre Wünsche."},{"id":"h3","fr":"Une femme prépare un voyage à Vienne","lines":[["M","Fährst du mit dem Auto nach Wien?"],["F","Nein, ich fahre mit dem Zug. Ich reise mit meinem Bruder."],["M","Und nimmst du den Koffer mit?"],["F","Ja. Ich reise nie ohne meinen Koffer. Und nie ohne mein Handy!"],["M","Gute Reise!"]],"tasks":[{"k":"mc","q":"Wie fährt die Frau nach Wien?","a":"Mit dem Zug.","o":["Mit dem Auto.","Mit dem Motorrad."]},{"k":"mc","q":"Sie reist mit …","a":"ihrem Bruder.","o":["ihrer Schwester.","ihrem Freund."]},{"k":"rf","q":"Sie reist ohne Koffer.","a":false},{"k":"rf","q":"Sie reist nie ohne ihr Handy.","a":true}],"de":"Eine Frau fährt nach Wien."},{"id":"h4","fr":"Jonas veut devenir chanteur","lines":[["M","Ich heiße Jonas und ich will Sänger werden. Ich spiele Gitarre und ich singe jeden Tag."],["M","Mein Wunsch: Ich will ein Star in Europa werden. Aber zuerst will ich die Ausbildung abschließen."],["M","Meine Eltern sagen: Die Ausbildung ist wichtig."]],"tasks":[{"k":"mc","q":"Was will Jonas werden?","a":"Sänger.","o":["Politiker.","Lehrer."]},{"k":"rf","q":"Jonas singt jeden Tag.","a":true},{"k":"mc","q":"Was will er zuerst machen?","a":"Die Ausbildung abschließen.","o":["Eine Weltreise machen.","Heiraten."]},{"k":"mc","q":"Was sagen die Eltern?","a":"Die Ausbildung ist wichtig.","o":["Musik ist wichtig.","Geld ist wichtig."]}],"de":"Jonas will Sänger werden."},{"id":"h5","fr":"Cinq projets, une question par projet","tasks":[{"k":"mc","q":"Was wird die Frau?","a":"Ingenieurin.","o":["Lehrerin.","Ärztin."],"lines":[["F","Ich will nicht Lehrerin werden. Ich werde Ingenieurin."]]},{"k":"rf","q":"Der Mann reist mit seiner Familie.","a":false,"lines":[["M","Ich fahre mit dem Motorrad nach Italien, ohne meine Familie."]]},{"k":"mc","q":"Was will der Mann?","a":"Reisen und Sprachen lernen.","o":["Heiraten und Geld verdienen.","Sänger werden."],"lines":[["F","Was sind deine Wünsche?"],["M","Ich will viel reisen und Sprachen lernen."]]},{"k":"fill","q":"Der Bruder läuft jeden Tag ___ Kilometer.","a":["10","zehn"],"lines":[["M","Mein Bruder läuft jeden Tag zehn Kilometer."]]},{"k":"mc","q":"Wann wollen sie heiraten?","a":"Im Mai.","o":["Im März.","Im Juni."],"lines":[["F","Wir wollen im Mai heiraten."]]}],"de":"Fünf Pläne.","seg":1}],"lesen":[{"id":"r1","de":"Wer will Popstar werden?","text":["Lena ist 19 Jahre alt und will Sängerin werden. Sie singt sehr gut und spielt Gitarre.","Zuerst will sie die Ausbildung abschließen. Dann will sie im Ausland Musik studieren.","Ihr Bruder Jonas will auf keinen Fall Star werden. Er wird Mechatroniker und will viel Geld verdienen."],"tasks":[{"k":"fill","q":"Lena ist ___ Jahre alt.","a":["19","neunzehn"]},{"k":"mc","q":"Was will Lena werden?","a":"Sängerin.","o":["Lehrerin.","Politikerin."]},{"k":"mc","q":"Was will sie zuerst machen?","a":"Die Ausbildung abschließen.","o":["Im Ausland studieren.","Heiraten."]},{"k":"rf","q":"Jonas will Star werden.","a":false},{"k":"mc","q":"Was wird Jonas?","a":"Mechatroniker.","o":["Sänger.","Arzt."]}]},{"id":"r2","de":"Meine Wünsche","text":["Ich bin Amira und ich habe drei Wünsche.","Ich will unbedingt eine Fremdsprache lernen: Spanisch. Ich möchte mit meiner Freundin eine Weltreise machen.","Und ich will den Führerschein machen. Aber ich will auf keinen Fall ein Auto kaufen: Ich fahre gern mit dem Fahrrad."],"tasks":[{"k":"fill","q":" selle).</p><p>À table : {den Tisch} <b>{decken}</b> (mettre la table). Le linge : {die Wäsche} <b>{waschen}</b>.</p>","de":"Im Haushalt"},{"id":"adj","ic":"🧼","title":"Propre, rangé, rapide","memo":"<p>{ordentlich} (ordonné) · {sauber} (propre) ≠ {schmutzig} (sale) · {fertig} (fini, prêt) · {schnell} (rapide).</p><p><b>{auf sein}</b> = être ouvert : {Das Fenster ist auf.} Son contraire : {<b>zu</b>machen} = fermer.</p><p><b class=\"der\">{der}</b> {Mitbewohner} = le colocataire.</p>","de":"Sauber und ordentlich"},{"id":"imp1","ic":"☝️","title":"L’impératif avec du","memo":"<p>On part de la forme en du, puis on enlève <b>-st</b> et le pronom : {du kommst} → <b>{Komm!}</b> · {du spülst} → <b>{Spül!}</b></p><p>Le changement e → {i} reste : {du vergisst} → <b>{Vergiss!}</b> · {du nimmst} → <b>{Nimm!}</b> Le changement a → {ä} disparaît : {du schläfst} → <b>{Schlaf!}</b></p><p>Verbes séparables : <b>{Räum}</b> {die Spülmaschine} <b>{aus}</b>! Irréguliers : {sein} → <b>{Sei!}</b> · {haben} → <b>{Hab!}</b></p><p><b>{bitte}</b> et <b>{doch}</b> rendent l’ordre plus aimable.</p>","de":"Imperativ mit du"},{"id":"imp2","ic":"👥","title":"L’impératif avec ihr","memo":"<p>Pour plusieurs personnes qu’on tutoie, on prend la forme en <b>{ihr}</b> sans le pronom : {ihr deckt} → <b>{Deckt}</b> {den Tisch!} · {ihr schlaft} → <b>{Schlaft}</b> {gut!} · {ihr seid} → <b>{Seid}</b> {pünktlich!}</p><table><tr><th></th><th>du</th><th>{ihr}</th><th>{Sie}</th></tr><tr><td>{kommen}</td><td>{Komm!}</td><td>{Kommt!}</td><td>{Kommen Sie!}</td></tr><tr><td>{vergessen}</td><td>{Vergiss!}</td><td>{Vergesst!}</td><td>{Vergessen Sie!}</td></tr><tr><td>{sein}</td><td>{Sei!}</td><td>{Seid!}</td><td>Seien {Sie!}</td></tr></table>","de":"Imperativ mit ihr"},{"id":"akk","ic":"🎯","title":"Les pronoms à l’accusatif","memo":"<table class=\"cj\"><tr><th>Nominatif</th><th>Accusatif</th></tr><tr><td>{ich}</td><td>{<b>mich</b>}</td></tr><tr><td>du</td><td>{<b>dich</b>}</td></tr><tr><td>{er}</td><td>{<b>ihn</b>}</td></tr><tr><td>es</td><td>es</td></tr><tr><td>{sie} (elle)</td><td>{sie}</td></tr><tr><td>{wir}</td><td>{<b>uns</b>}</td></tr><tr><td>{ihr}</td><td>{<b>euch</b>}</td></tr><tr><td>{sie / Sie}</td><td>{sie / Sie}</td></tr></table><p>{Holst du} <b>{mich}</b> {ab?} · {Ich rufe} <b>{dich}</b> an. · {Der Tisch? Ich decke} <b>{ihn}</b> {gleich.} Seul le masculin change à la 3<sup>e</sup> personne : {er} → <b>{ihn}</b>.</p>","de":"Pronomen im Akkusativ","match":[{"t":"Nominatif → accusatif : relie chaque pronom à sa forme","p":[["ich","mich"],["du","dich"],["er","ihn"],["wir","uns"],["ihr","euch"]],"say":"lr"}]},{"id":"bit","ic":"🗣️","title":"Demander un service, se présenter comme colocataire","memo":"<p>Demander : <b>{Spül bitte}</b> {das Geschirr!} · <b>{Deckt bitte}</b> {den Tisch!} · <b>{Sei doch so lieb und}</b> {hilf mir.} · {Ruf ihn} <b>{doch bitte}</b> {zurück.}</p><p>Se présenter : {Die Wohnung} <b>{sieht sehr schön aus}</b>. · {Ich bin sehr} <b>{ordentlich}</b>. · {Ich} <b>{hasse}</b> {Unordnung.} · {Ich koche} <b>{wahnsinnig gern}</b>.</p>","de":"Bitten"},{"id":"perf","ic":"🧱","title":"Les formes des verbes de la leçon","memo":"<p>Chaque verbe s’apprend avec ses formes : le passé composé, c’est-à-dire l’auxiliaire <b>{hat}</b> ou <b>{ist}</b> suivi du participe (écris les deux mots), et, pour certains verbes, un présent irrégulier avec <b>du</b> et <b>{er} / {sie}</b>.</p><p>abtrocknen → <b>hat abgetrocknet</b> · abwaschen → <b>hat abgewaschen</b> · spülen → <b>hat gespült</b> · waschen → <b>hat gewaschen</b> · hassen → <b>hat gehasst</b> · zumachen → <b>hat zugemacht</b></p>","de":"Verbformen"}],"items":[{"t":"w","id":"w-der-haushalt","u":"hh","de":"der Haushalt","fr":"le ménage (la maison à tenir)","alt":["foyer","tâches ménagères"]},{"t":"w","id":"w-das-geschirr","u":"hh","de":"das Geschirr","fr":"la vaisselle","em":"🍽️"},{"t":"w","id":"w-die-spuelmaschine","u":"hh","de":"die Spülmaschine","fr":"le lave-vaisselle","pl":"die Spülmaschinen"},{"t":"w","id":"w-die ngerufen. Ruf sie bitte zurück.","Wann hat sie angerufen?","Vor einer Stunde.","Gut, ich rufe sie sofort an."]],"cur":1,"tx":[{"id":"x-komm-sofort-runter-und-deck-bitt","de":"Komm sofort runter und deck bitte den Tisch!","fr":"Descends tout de suite et mets la table, s’il te plaît !"},{"id":"x-spuel-bitte-das-geschirr-und-rae","de":"Spül bitte das Geschirr und räum die Spülmaschine aus. Ich wasche die Wäsche.","fr":"Fais la vaisselle, s’il te plaît, et vide le lave-vaisselle. Moi, je lave le linge."},{"id":"x-kinder-raeumt-bitte-die-kueche-a","de":"Kinder, räumt bitte die Küche auf und vergesst die Hausaufgaben nicht!","fr":"Les enfants, rangez la cuisine, s’il vous plaît, et n’oubliez pas les devoirs !"},{"id":"x-holst-du-mich-bitte-ab-ja-ich-ho","de":"Holst du mich bitte ab? – Ja, ich hole dich um zehn Uhr ab.","fr":"Tu viens me chercher, s’il te plaît ? – Oui, je viens te chercher à dix heures."},{"id":"x-wo-ist-jonas-ich-sehe-ihn-nicht-","de":"Wo ist Jonas? Ich sehe ihn nicht. – Ruf ihn doch bitte an!","fr":"Où est Jonas ? Je ne le vois pas. – Appelle-le donc, s’il te plaît !"},{"id":"x-ich-bin-sehr-ordentlich-und-ich-","de":"Ich bin sehr ordentlich und ich hasse Unordnung. Ich putze oft und gründlich.","fr":"Je suis très ordonné et je déteste le désordre. Je fais souvent le ménage, et à fond."}],"hoer":[{"id":"h1","fr":"Une mère appelle son fils","lines":[["F","Jonas, komm sofort runter!"],["M","Ja, Mama. Was ist?"],["F","Deck bitte den Tisch. Und räum die Spülmaschine aus!"],["M","Okay. Und das Geschirr?"],["F","Das Geschirr spüle ich. Ruf bitte Papa an: Das Essen ist fertig."],["M","Ich rufe ihn sofort an."]],"tasks":[{"k":"mc","q":"Was soll Jonas zuerst machen?","a":"Den Tisch decken.","o":["Das Geschirr spülen.","Die Wäsche waschen."]},{"k":"rf","q":"Jonas soll die Spülmaschine ausräumen.","a":true},{"k":"mc","q":"Wer spült das Geschirr?","a":"Die Mutter.","o":["Jonas.","Der Vater."]},{"k":"mc","q":"Wen ruft Jonas an?","a":"Den Vater.","o":["Die Oma.","Die hlschrank."]}],"de":"Ein Vater spricht mit den Kindern."},{"id":"h5","fr":"Cinq moments à la maison, une question par moment","tasks":[{"k":"mc","q":"Wann wäscht die Frau die Wäsche?","a":"Morgen.","o":["Heute.","Am Wochenende."],"lines":[["F","Die Wäsche? Ich wasche sie morgen. Heute habe ich keine Zeit."]]},{"k":"rf","q":"Die Küche ist sauber.","a":false,"lines":[["M","Die Küche ist schmutzig. Putz sie bitte!"]]},{"k":"rf","q":"Die Frau spricht mit Kindern.","a":true,"lines":[["F","Schlaft gut, Kinder! Und vergesst die Hausaufgaben nicht!"]]},{"k":"fill","q":"Sie kommen um ___ Uhr.","a":["3","drei"],"lines":[["M","Besucht ihr uns am Sonntag?"],["F","Ja, gern. Wir kommen um drei."]]},{"k":"mc","q":"Was ist schmutzig?","a":"Der Boden.","o":["Das Geschirr.","Die Wäsche."],"lines":[["F","Sei doch so lieb und hilf mir. Der Boden ist so schmutzig."]]}],"de":"Zu Hause: fünf Situationen.","seg":1}],"lesen":[{"id":"r1","de":"Eine Nachricht für Jonas","text":["Lieber Jonas, ich komme heute erst um acht Uhr. Mach bitte den Haushalt!","Spül das Geschirr und räum die Küche auf. Wasch bitte auch die Wäsche: Sie ist im Bad.","Und vergiss den Abfall nicht! Danke. Du bist so lieb! Lena"],"tasks":[{"k":"mc","q":"Wann kommt Lena?","a":"Um acht Uhr.","o":["Um sechs Uhr.","Um zehn Uhr."]},{"k":"rf","q":"Jonas soll das Geschirr spülen.","a":true},{"k":"mc","q":"Wo ist die Wäsche?","a":"Im Bad.","o":["In der Küche.","Im Keller."]},{"k":"mc","q":"Was soll Jonas nicht vergessen?","a":"Den Abfall.","o":["Den Schlüssel.","Die Hausaufgaben."]},{"k":"rf","q":"Lena schreibt die Nachricht.","a":true}]},{"id":"r2","de":"Mitbewohner gesucht","text":["Wir sind Anna und Malik und suchen einen Mitbewohner oder eine Mitbewohnerin.","Das Zimmer ist 15 Quadratmeter groß. Die Wohnung ist sauber: Wir putzen jeden Samstag.","Wir kochen gern und oft. Bist du ordentlich? Dann ruf uns an!"],"tasks":[{"k":"mc","q":"Anna und Malik suchen …","a":"einen Mitbewohner oder eine Mitbewohnerin.","o":["eine Wohnung.", > {Schild} (le panneau).</p><p>{tragen} change de voyelle : du {tr<b>ä</b>gst}, {er} / {sie} {tr<b>ä</b>gt}. {Einen Helm} <b>{tragen}</b> = porter un casque.</p><p><b>{zu Fuß}</b> = à pied : {Ich gehe zu Fuß.}</p>","de":"Im Straßenverkehr"},{"id":"all","ic":"🐕","title":"Au quotidien","memo":"<p><b>{zum Beispiel}</b> = par exemple. <b class=\"das\">{das}</b> {Krankenhaus} = l’hôpital (kranken + {Haus}).</p><p>{aufstehen} se sépare : {Ich} <b>stehe</b> {um sechs Uhr} <b>{auf}</b>. Passé : {ist aufgestanden.}</p><p>{leise} (doucement, sans bruit) ≠ {laut.}</p>","de":"Im Alltag"},{"id":"du","ic":"🚫","title":"Le verbe dürfen","memo":"<table class=\"cj\"><tr><th></th><th>{dürfen}</th></tr><tr><td>{ich}</td><td>{<b>darf</b>}</td></tr><tr><td>du</td><td>{<b>darfst</b>}</td></tr><tr><td>{er / sie / man}</td><td>{<b>darf</b>}</td></tr><tr><td>{wir}</td><td>{dürfen}</td></tr><tr><td>{ihr}</td><td>{dürft}</td></tr><tr><td>{sie / Sie}</td><td>{dürfen}</td></tr></table><p>{dürfen} = avoir le droit, la permission. Hier <b>{darf}</b> {man parken.} Avec {nicht}, c’est une <b>interdiction</b> : Hier <b>{darf}</b> {man} <b>{nicht}</b> {rauchen.}</p>","de":"dürfen","match":[{"t":"dürfen : relie le pronom à sa forme","p":[["ich","darf"],["du","darfst"],["wir","dürfen"],["ihr","dürft"]],"say":"lrj"}]},{"id":"mu","ic":"⚠️","title":"Le verbe müssen","memo":"<table class=\"cj\"><tr><th></th><th>{müssen}</th></tr><tr><td>{ich}</td><td>{<b>muss</b>}</td></tr><tr><td>du</td><td>{<b>musst</b>}</td></tr><tr><td>{er / sie / man}</td><td>{<b>muss</b>}</td></tr><tr><td>{wir}</td><td>{müssen}</td></tr><tr><td>{ihr}</td><td>{müsst}</td></tr><tr><td>{sie / Sie}</td><td>{müssen}</td></tr></table><p>{müssen} = être obligé de. {Bei Rot} <b>{musst}</b> {du stehen.}</p><p>Attention au sens avec {nicht} : Du <b>{musst nicht}</b> {kommen} = tu n’es <b>pas obligé</b> de venir. Pour interdire, on dit Du <b>{darfst nicht}</b> {kommen.}</p>","de":"müssen","match":[{"t":"müssen : relie le pronom à sa forme","p":[["ich","muss"],["du","musst"],["wir","müssen"],["ihr","müsst"]],"say":"lrj"}]},{"id":"bw","ic":"⚖️","title":"Autorisé, interdit, grave ?","memo":"<p>Dire la règle : {Das ist} <b>{erlaubt}</b>. ≠ {Das ist} <b>{verboten}</b>. · {Das ist} <b>{nicht erlaubt}</b>.</p><p>Juger : {Das ist} <b>{in Ordnung}</b>. ≠ {Das ist} <b>{nicht in Ordnung}</b>. · {Das ist} ({sehr}) <b>{gefährlich}</b>. · {Das ist} <b>{nicht so schlimm}</b>.</p><p>Si on ne comprend pas : <b>{Das verstehe ich nicht.}</b></p>","de":"Erlaubt oder verboten?"},{"id":"perf","ic":"🧱","title":"Les formes des verbes de la leçon","memo":"<p>Chaque verbe s’apprend avec ses formes : le passé composé, c’est-à-dire l’auxiliaire <b>{hat}</b> ou <b>{ist}</b> suivi du participe (écris les deux mots), et, pour certains verbes, un présent irrégulier avec <b>du</b> et <b>{er} / {sie}</b>.</p><p>achten → <b>hat geachtet</b> · hupen → <b>hat gehupt</b> · parken → <b>hat geparkt</b> · schieben → <b>hat geschoben</b> · stehen bleiben → <b>ist stehen geblieben</b> · tragen → <b>hat getragen</b> · verstehen → <b>hat verstanden</b> · aufstehen → <b>ist aufgestanden</b> · baden → <b>hat gebadet</b> · grillen → <b>hat gegrillt</b> · klingeln → <b>hat geklingelt</b> · sitzen → <b>hat gesessen</b></p>","de":"Verbformen"}],"items":[{"t":"w","id":"w-der-verkehr","u":"vk","de":"der Verkehr","fr":"la circulation","alt":["trafic"]},{"t":"w","id":"w-der-strassenverkehr","u":"vk","de":"der Straßenverkehr","fr":"la circulation routière"},{"t":"w","id":"w-der-fahrer","u":"vk","de":"der Fahrer","fr":"le conducteur","alt":["chauffeur"],"pl":"die Fahrer"},{"t":"w","id":"w-die-regel","u":"vk","de":"die Regel","fr":"la règle","pl":"die Regeln"},{"t":"w","id":"w-das-schild","u":"vk","de":"das Schild","fr":"le panneau","alt":["pancarte"],"pl":"die Schilder"},{"t":"w","id":"w-der-helm","u":"vk","de":"der Helm","fr":"le casque","em":"⛑️","pl":"die Helme"},{"t":"w","id":"w-tragen","u":"vk","de":"tragen","fr":"porter"},{"t":"w","id":"w-einen-helm-tragen tag muss ich nicht arbeiten. Dann darf ich lange schlafen!"]],"tasks":[{"k":"fill","q":"Der Mann muss um ___ Uhr aufstehen.","a":["6","sechs"]},{"k":"mc","q":"Wo arbeitet er?","a":"Im Krankenhaus.","o":["In einer Praxis.","In der Apotheke."]},{"k":"rf","q":"Im Krankenhaus darf man rauchen.","a":false},{"k":"mc","q":"Was darf er am Sonntag?","a":"Lange schlafen.","o":["Arbeiten.","Grillen."]}],"de":"Ein Arzt spricht über seinen Tag."},{"id":"h5","fr":"Cinq règles, une question par règle","tasks":[{"k":"rf","q":"Hier ist Parken erlaubt.","a":false,"lines":[["F","Hier dürfen Sie nicht parken. Das Schild sagt: Parken verboten."]]},{"k":"mc","q":"Warum muss man langsam fahren?","a":"Hier spielen Kinder.","o":["Die Ampel ist rot.","Es ist Nacht."],"lines":[["M","Du musst langsam fahren. Hier spielen Kinder."]]},{"k":"rf","q":"Man darf im Bus essen.","a":false,"lines":[["F","Darf ich im Bus essen?"],["M","Nein, das ist nicht erlaubt."]]},{"k":"mc","q":"Wie kommt der Mann?","a":"Zu Fuß.","o":["Mit dem Auto.","Mit dem Bus."],"lines":[["M","Ich fahre nicht mit dem Auto. Ich gehe zu Fuß."]]},{"k":"mc","q":"Was sagt die Frau?","a":"Das ist in Ordnung.","o":["Das ist verboten.","Das ist gefährlich."],"lines":[["F","Das ist nicht so schlimm. Das ist in Ordnung."]]}],"de":"Fünf Regeln.","seg":1}],"lesen":[{"id":"r1","de":"Regeln im Park","text":["Im Stadtpark gibt es Regeln. Kinder dürfen auf der Wiese spielen und man darf ein Picknick machen.","Grillen ist verboten. Man darf auch nicht im See baden: Das ist gefährlich.","Hunde sind erlaubt. Radfahrer müssen langsam fahren."],"tasks":[{"k":"rf","q":"Kinder dürfen auf der Wiese spielen.","a":true},{"k":"mc","q":"Was ist verboten?","a":"Grillen.","o":["Ein Picknick machen.","Spielen."]},{"k":"mc","q":"Warum darf man nicht im See baden?","a":"Das ist gefährlich.","o":["Das ist langweilig.","Das ist teuer."]},{"k":"rf","q":"Hunde sind verboten.","a":false},{"k":"mc","q":"Was müssen Radfahrer machen?","a":"Langsam fahren.","o":["Schieben.","Zu Fuß gehen."]}]},{"id":"r2","de":"Mein Tag","text":["Ich bin Krankenschwester und arbeite im Krankenhaus. Ich muss jeden Tag um fünf Uhr aufstehen.","Ich fahre mit dem Fahrrad und ich trage immer einen Helm. Im Krankenhaus darf man nicht laut sein.","Am Wochenende muss ich nicht arbeiten. Dann gehe ich mit meinem Hund in den Park."],"tasks":[{"k":"mc","q":"Wo arbeitet die Frau?","a":"Im Krankenhaus.","o":["In der Apotheke.","In einer Praxis."]},{"k":"fill","q":"Sie muss um ___ Uhr aufstehen.","a":["5","fünf"]},{"k":"rf","q":"Sie fährt mit dem Auto.","a":false},{"k":"rf","q":"Sie trägt einen Helm.","a":true},{"k":"mc","q":"Was macht sie am Wochenende?","a":"Sie geht mit dem Hund in den Park.","o":["Sie arbeitet.","Sie grillt."]}]}],"qa":[[["Darf ich hier rauchen?","Nein, das ist verboten."],["Was musst du morgen machen?","Ich muss arbeiten."],["Warum trägst du einen Helm?","Ohne Helm ist es gefährlich."],["Wann musst du aufstehen?","Um sechs Uhr."]],[["Wo dürfen Hunde spielen?","Auf der Wiese."],["Ist das schlimm?","Nein, das ist in Ordnung."],["Wie kommst du nach Hause?","Zu Fuß."],["Verstehst du die Regel?","Nein, das verstehe ich nicht."]]],"bank":["trägst","tragst","trägt","trage","tragt","tragen","darf","darfst","dürfen","dürft","Hier","man","nicht","rauchen","im","Bus","essen","ich","parken","Bei","Grün","du","gehen","muss","musst","müssen","müsst","Rot","stehen","Motorradfahrer","einen","Helm","um","sechs","Uhr","aufstehen","langsam","fahren","Das","ist","verboten","erlaubt","sehr","gefährlich","so","schlimm","in","Ordnung","verstehe","uns","auf","der","Wiese","grillen"],"bankFr":["Ici","on","n’a","pas","le","droit","de","fumer","manger","dans","bus","Puis-je","me","garer","Au","vert","tu","peux","passer","rouge","dois","t’arrêter","Les","motards","doivent","porter","un","casque","Je","lever","à","six","heures","rouler","lentement","C’est","interdit","Ce","n’est","autorisé","très","dangereux","si","grave","d’accord","correct","ne","comprends","cela","Chez","nous","faire","barbecue","sur","la","pelouse"]},{"id":"a1-22","n":22,"title":"Am besten sind seine Schuhe!","fr":"Vêtements, comparatif et superlatif","tspec":{"w":[8,5,7],"s":[12,7,10],"k":[6,4,5]},"units":[{"id":"kl1","ic":"👕","title":"Les vêtements (1)","memo":"<p><b class=\"die\">{die}</b> {Kleidung} = les vêtements (singulier en allemand). En haut : <b class=\"das\">{das}</b> {T}-Shirt, <b class=\"das\">{das}</b> {Hemd} (chemise d’homme), <b class=\"die\">{die}</b> {Bluse} (chemisier), <b class=\"der\">{der}</b> {Pullover}, <b class=\"die\">{die}</b> {Jacke}, <b class=\"der\">{der}</b> {Mantel.}</p><p>Attention : <b class=\"die\">{die}</b> {Hose} est au singulier (un pantalon). <b class=\"der\">{der}</b> {Rock} = la jupe, <b class=\"das\">{das}</b> {Kleid} = la robe.</p>","de":"Kleidung (1)"},{"id":"kl2","ic":"🧦","title":"Les vêtements (2) et s’habiller","memo":"<p>Deux verbes séparables : {<b>an</b>ziehen} (mettre un vêtement) → {Ich} <b>{ziehe}</b> {die Jacke} <b>an</b>. · {<b>an</b>haben} (porter sur soi) → {Sie} <b>{hat}</b> {ein Kleid} <b>an</b>.</p><p><b>{zuletzt}</b> = la dernière fois · <b>{zurzeit}</b> = en ce moment.</p>","de":"Kleidung (2)"},{"id":"ko1","ic":"📈","title":"Le comparatif","memo":"<table><tr><th>Adjectif</th><th>Comparatif</th></tr><tr><td>{schön, lustig}</td><td>{schön<b>er</b>, lustig<b>er</b>}</td></tr><tr><td>{alt, groß, kurz}</td><td>{<b>ä</b>lter, gr<b>ö</b>ßer, k<b>ü</b>rzer}</td></tr><tr><td>{gut}</td><td>{<b>besser</b>}</td></tr><tr><td>{gern}</td><td>{<b>lieber</b>}</td></tr><tr><td>{viel}</td><td>{<b>mehr</b>}</td></tr></table><p>On ajoute <b>-er</b>, jamais « {mehr} » devant l’adjectif. Beaucoup d’adjectifs courts prennent un tréma.</p><p>Plus… que : comparatif + <b>{als}</b>. {Das Hemd gefällt ihr besser} <b>{als}</b> {die Hose.} · Aussi… que : <b>({genau}){so}</b> + adjectif + <b>{wie}</b>.</p>","de":"Komparativ","match":[{"t":"Relie chaque adjectif à son comparatif","p":[["gut","besser"],["gern","lieber"],["viel","mehr"],["alt","älter"],["groß","größer"]],"say":"lr"}]},{"id":"ko2","ic":"🏆","title":"Le superlatif","memo":"<table><tr><th>Adjectif</th><th>Superlatif</th></tr><tr><td>{schön, lustig}</td><td>{<b>am</b> schön<b>sten</b>, <b>am</b> lustig<b>sten</b>}</td></tr><tr><td>{alt, kurz} (finale -t, -z)</td><td>{am <b>ä</b>lt<b>esten</b>, am k<b>ü</b>rz<b>esten</b>}</td></tr><tr><td>{groß}</td><td>{am gr<b>ö</b>ßten}</td></tr><tr><td>{gut}</td><td>{<b>am besten</b>}</td></tr><tr><td>{gern}</td><td>{<b>am liebsten</b>}</td></tr><tr><td>{viel}</td><td>{<b>am meisten</b>}</td></tr></table><p>Le superlatif se forme avec <b>{am}</b> + adjectif + <b>-sten</b>. Après -d, -t, -s, -z, on intercale un e : {am} {ält<b>e</b>sten}.</p>","de":"Superlativ"},{"id":"mei","ic":"🗣️","title":"Donner son avis sur des vêtements","memo":"<p>Demander : <b>{Welches}</b> {T}-Shirt {findest du} <b>{am schönsten}</b>? – <b>{Das hier.}</b> {Und du?} – <b>{Mir gefällt das besser.}</b></p><p>Renforcer : {Das ist} <b>{total}</b> {schön.} · {Das ist} <b>{richtig}</b> {toll.} · {Das ist doch} <b>{wahnsinnig}</b> {langweilig.} · <b>{Klasse!}</b></p><p>Raconter : {Ich habe das T}-Shirt {in Berlin gekauft. Ich} <b>{ziehe}</b> {es oft} <b>an</b>.</p>","de":"Meinung über Kleidung"},{"id":"perf","ic":"🧱","title":"Les formes des verbes de la leçon","memo":"<p>Chaque verbe s’apprend avec ses formes : le passé composé, c’est-à-dire l’auxiliaire <b>{hat}</b> ou <b>{ist}</b> suivi du participe (écris les deux mots), et, pour certains verbes, un présent irrégulier avec <b>du</b> et <b>{er} / {sie}</b>.</p><p>anhaben → <b>hat angehabt</b> · anziehen → <b>hat angezogen</b> · erzählen → <b>hat erzählt</b> · tragen → <b>hat getragen</b></p>","de":"Verbformen"}],"items":[{"t":"w","id":"w-die-kleidung","u":"kl1","de":"die Kleidung","fr":"les vêtements","alt":["vêtement","habits"]},{"t":"w","id":"w-das-t-shirt","u":"kl1","de":"das T-Shirt","fr":"le tee-shirt","em":"👕","pl":"die T-Shirts"},{"t":"w","id":"w-das-hemd","u":"kl1","de er hat mehr Schuhe?","a":"Der Bruder.","o":["Die Mutter.","Der Vater."]}]}],"qa":[[["Welches T-Shirt findest du am schönsten?","Das hier."],["Was ziehst du heute an?","Eine Hose und einen Pullover."],["Wer ist älter, du oder dein Bruder?","Mein Bruder ist älter."],["Was isst du am liebsten?","Am liebsten esse ich Fisch."]],[["Wo hast du die Jacke gekauft?","In Berlin."],["Wie findest du den Hut?","Total lustig!"],["Ist der Rock teurer als die Hose?","Nein, er ist billiger."],["Wann hast du das Kleid zuletzt angehabt?","Am Montag."]]],"bank":["schöner","schönere","lustiger","lustigster","älter","alter","größer","großer","kürzer","kurzer","besser","guter","lieber","gerner","mehr","vieler","mehrer","als","wie","so","dann","schönsten","lustigsten","Welches","T-Shirt","findest","du","am","Das","hier","Und","Mir","gefällt","Hemd","ihr","die","Hose","Sie","mag","Blau","genauso","gern","Rot","besten","sind","seine","Schuhe","Ich","habe","in","Berlin","gekauft","ziehe","es","oft","an","Hast","Kleid","schon","gesehen","ist","total","schön","doch","wahnsinnig","langweilig","richtig","toll","Klasse"],"bankFr":["Quel","tee-shirt","trouves-tu","le","plus","beau","Celui-ci","Et","toi","Moi","je","préfère","celui-là","La","chemise","lui","plaît","mieux","que","pantalon","Elle","aime","bleu","autant","rouge","ce","sont","ses","chaussures","J’ai","acheté","à","Berlin","mets","souvent","As-tu","déjà","vu","robe","C’est","vraiment","très","Mais","terriblement","ennuyeux","est","super","Génial"]},{"id":"a1-23","n":23,"title":"Ins Wasser gefallen?","fr":"Météo, points cardinaux, donner une raison avec denn","tspec":{"w":[8,5,7],"s":[7,4,6],"k":[6,4,5]},"units":[{"id":"wt1","ic":"☀️","title":"Le temps qu’il fait : les noms","memo":"<p><b class=\"die\">{die}</b> {Sonne} (le soleil est féminin en allemand), <b class=\"der\">{der}</b> {Regen}, <b class=\"der\">{der}</b> {Schnee}, <b class=\"der\">{der}</b> {Wind}, <b class=\"die\">{die}</b> {Wolke}, <b class=\"der\">{der}</b> {Nebel} (le brouillard), <b class=\"das\">{das}</b> {Gewitter} (l’orage).</p><p>La température : {Es sind} 25 <b>{Grad}</b>. · {minus} 2 {Grad} · plus 8 {Grad.}</p>","de":"Das Wetter (1)"},{"id":"wt2","ic":"🌧️","title":"Le temps qu’il fait : verbes et adjectifs","memo":"<p>Avec les verbes du temps, le sujet est <b>es</b> : Es <b>{regnet}</b>. · Es <b>{schneit}</b>. Mais : {Die Sonne} <b>{scheint}</b>.</p><p>Du nom à l’adjectif avec <b>-ig</b> : {die Sonne} → sonn<b>ig</b> · {der Wind} → {wind}<b>ig</b> · {der Nebel} → nebl<b>ig</b>.</p><p>Le suffixe <b>-los</b> = « sans » : {die Wolken} → {wolken}<b>los</b> (sans nuages) · {die Arbeit} → arbeits<b>los</b>.</p>","de":"Das Wetter (2)","match":[{"t":"Relie chaque nom à son adjectif","p":[["die Sonne","sonnig"],["der Wind","windig"],["der Nebel","neblig"],["die Wolke","bewölkt"]],"say":"lr"}]},{"id":"him","ic":"🧭","title":"Points cardinaux et autres mots","memo":"<p>Les quatre points cardinaux sont masculins : <b class=\"der\">{der}</b> {Norden}, <b class=\"der\">{der}</b> {Süden}, <b class=\"der\">{der}</b> {Osten}, <b class=\"der\">{der}</b> {Westen.} On dit <b>{im}</b> {Norden}, <b>{im}</b> {Süden.}</p><p><b class=\"das\">{das}</b> {Glück} = la chance ou le bonheur : {Wir haben Glück.} · {gute} / {schlechte} <b>{Laune}</b> {haben} = être de bonne / mauvaise humeur.</p>","de":"Himmelsrichtungen"},{"id":"wie","ic":"🌡️","title":"Dire le temps qu’il fait","memo":"<p><b>{Wie ist das Wetter?}</b> – {Es ist sonnig} / {windig} / {bewölkt} / {neblig.} · {Es regnet.} · {Es schneit.} · {Die Sonne scheint.} · {Es donnert und blitzt.}</p><p>La température : {Es ist} <b>{warm}</b>. {Es sind} 25 {Grad.} · {Es ist} <b>{kühl}</b>. · {Es ist} <b>{kalt}</b>. {Es sind minus} 2 {Grad.}</p>","de":"Wie ist das Wetter?"},{"id":"den","ic":"🔗","title":"denn : donner une raison","memo":"<p><b>{denn}</b> = car. Il relie deux phrases et <b>ne change pas l’ordre des mots</b> : après {denn} viennent le sujet puis le verbe, comme dans une phrase normale.</p><p>{Es war wunderbar}, <b>{denn}</b> {wir} <b>{hatten}</b> {ein Traumwetter.} · {Ich bleibe zu Hause}, <b>{denn}</b> es <b>{regnet}</b>.</p><p>On met une virgule avant {denn.}</p>","de":"denn"},{"id":"perf","ic":"🧱","title":"Les formes des verbes de la leçon","memo":"<p>Chaque verbe s’apprend avec ses formes : le passé composé, c’est-à-dire l’auxiliaire <b>{hat}</b> ou <b>{ist}</b> suivi du participe (écris les deux mots), et, pour certains verbes, un présent irrégulier avec <b>du</b> et <b>{er} / {sie}</b>.</p><p>regnen → <b>hat geregnet</b> · schneien → <b>hat geschneit</b> · scheinen → <b>hat geschienen</b> · reisen → <b>ist gereist</b></p>","de":"Verbformen"}],"items":[{"t":"w","id":"w-die-sonne","u":"wt1","de":"die Sonne","fr":"le soleil","em":"☀️","pl":"die Sonnen"},{"t":"w","id":"w-der-regen","u":"wt1","de":"der Regen","fr":"la pluie","em":"🌧️"},{"t":"w","id":"w-der-schnee","u":"wt1","de":"der Schnee","fr":"la neige","em":"❄️"},{"t":"w","id":"w-der-wind","u":"wt1","de":"der Wind","fr":"le vent","em":"🌬️","pl":"die Winde"},{"t":"w","id":"w-der-sturm","u":"wt1","de":"der Sturm","fr":"la tempête","em":"🌪️","pl":"die Stürme"},{"t":"w","id":"w-die-wolke","u":"wt1","de":"die Wolke","fr":"le nuage","em":"☁️","pl":"die Wolken"},{"t":"w","id":"w-der-nebel","u":"wt1","de":"der Nebel","fr":"le brouillard","em":"🌫️"},{"t":"w","id":"w-das-gewitter","u":"wt1","de":"das Gewitter","fr":"l’orage","em":"⛈️","pl":"die Gewitter"},{"t":"w","id":"w-der-himmel","u":"wt1","de":"der Himmel","fr":"le ciel"},{"t":"w","id":"w-der-grad","u":"wt1","de":"der Grad","fr":"le degré","pl":"die Grade"},{"t":"w","id":"w-regnen","u":"wt2","de":"regnen","fr":"pleuvoir"},{"t":"w","id":"w-schneien","u":"wt2","de":"schneien","fr":"neiger"},{"t":"w","id":"w-scheinen","u":"wt2","de":"scheinen","fr":"briller","alt":["luire"]},{"t":"w","id":"w-sonnig","u":"wt2","de":"sonnig","fr":"ensoleillé"},{"t":"w","id":"w-windig","u":"wt2","de":"windig","fr":"venteux","alt":["venté"]},{"t":"w","id":"w-neblig","u":"wt2"," achte}</b>, neunte…</td><td>{der zwanzig<b>ste</b>, einundzwanzig<b>ste</b>, dreißig<b>ste</b>}</td></tr></table><p>Quatre formes irrégulières : {erste, dritte, siebte, achte.}</p><p>La date : {Heute ist} <b>{der achte}</b> {Januar.} · {Ich habe} <b>{am achten}</b> {Januar Geburtstag.} · <b>{Vom}</b> {achten} <b>{bis zum}</b> achtzehnten {Januar.} Après {am, vom} et {zum}, l’ordinal finit en <b>-n</b>.</p>","de":"Das Datum"},{"id":"wue","ic":"💭","title":"würde : exprimer un souhait","memo":"<table class=\"cj\"><tr><th></th><th>{würde}</th></tr><tr><td>{ich}</td><td>{würde}</td></tr><tr><td>du</td><td>{würde<b>st</b>}</td></tr><tr><td>{er / sie}</td><td>{würde}</td></tr><tr><td>{wir}</td><td>{würde<b>n</b>}</td></tr><tr><td>{ihr}</td><td>{würde<b>t</b>}</td></tr><tr><td>{sie / Sie}</td><td>{würde<b>n</b>}</td></tr></table><p><b>{würde}</b> + <b>{gern}</b> + infinitif à la fin = « j’aimerais ». {Im Sommer} <b>{würde}</b> {ich} <b>{gern}</b> {eine Reise} <b>{machen}</b>. Avec <b>{am liebsten}</b>, on dit ce qu’on préférerait : {Ich würde} <b>{am liebsten}</b> {jeden Tag feiern.}</p>","de":"würde","match":[{"t":"würde : relie le pronom à sa forme","p":[["ich","würde"],["du","würdest"],["wir","würden"],["ihr","würdet"]],"say":"lrj"}]},{"id":"ein","ic":"✉️","title":"Inviter et répondre","memo":"<p>Inviter : {Ich} <b>{feiere}</b> {am Samstag meinen Geburtstag.} · {Ich} <b>{lade}</b> {dich} <b>{ein}</b>. · <b>{Kommst du auch?}</b> · <b>{Hoffentlich}</b> {hast du Zeit.}</p><p>Répondre : {Ja, gern. Ich komme.} · <b>{Leider kann ich nicht kommen.}</b></p><p>Cadeau et réussite : {Was} <b>{schenkst}</b> {du ihm?} · {Ich habe die Prüfung} <b>{bestanden}</b>. · {Ich} <b>{gratuliere}</b> {dir!}</p>","de":"Einladungen"},{"id":"perf","ic":"🧱","title":"Les formes des verbes de la leçon","memo":"<p>Chaque verbe s’apprend avec ses formes : le passé composé, c’est-à-dire l’auxiliaire <b>{hat}</b> ou <b>{ist}</b> suivi du participe (écris les deux mots), et, pour certains verbes, un prése function makeEx(it,rev){
  const s=rev?3:st(it).s,au=audioOK(),r=Math.random();
  if(it.t==="w"){
    if(it.rec)return mcWord(it,(rev||s>=2)?"fr2de":"de2fr");
    if(!rev&&s<=0)return mcWord(it,"de2fr");
    if(!rev&&s===1)return it.em&&imgOk()&&r<.6?(r<.3?emMc(it):emPick(it)):au&&r<.8?listenWord(it):mcWord(it,r<.95?"fr2de":"de2fr");
    if(it.em&&imgOk()&&Math.random()<.5)return emType(it);
    return rev&&dictable(it)&&au&&r<.25?dictEx(it):typeWord(it);
  }
  if(it.t==="s"){
    if(!rev&&s<=1)return au&&r<.35?listenBank(it):bankDe(it);
    return rev&&au&&r<.25?dictEx(it):typeSent(it);
  }
  if(it.t==="g")return clozeEx(it,rev||s>=2);
  if(it.t==="num")return numEx(it,rev||s>=2);
  if(it.t==="sp")return spEx(it,rev||s>=2);
  return recEx(it,rev?undefined:s>=2?1:0);
}
function forced(it,k){
  if(k==="any")return anyEx(it);
  if(it.t==="g")return clozeEx(it,true);if(it.t==="num")return numEx(it,k!=="listen");if(it.t==="r")return recEx(it);if(it.t==="sp")return spEx(it,true);
  if(k==="dict")return dictEx(it);
  if(k==="listen")return it.t==="s"?pick([listenSent,listenBank,listenBankFr])(it):listenWord(it);
  if(k==="mix")return it.t==="s"?pick([bankFr,bankDe,typeSent])(it):typeWord(it);
  return it.t==="s"?typeSent(it):typeWord(it);
}

/* note d'une traduction vers le français : part des mots de la référence retrouvés (accents, ordre et petites fautes tolérés) */
function scoreFr(input,ref){
  const a=nfr(input).split(" ").filter(Boolean),b=nfr(String(ref).replace(/\s*\([^)]*\)/g,"")).split(" ").filter(Boolean);if(!a.length||!b.length)return 0;
  const used=new Set();let good=0,tot=0;
  b.forEach(w=>{tot+=w.length;const tol=w.length>=9?2:w.length>=5?1:0,k=a.findIndex((x,i)=>!used.has(i)&&(x===w||(tol&&lev(x,w)<=tol)));if(k>=0){used.add(k);good+=w.length}});
  let sc=Math.round(good/tot*100);if(a.length>b.length*1.8)sc=Math.round(sc*.8);return sc;
}
/* note d'une traduction vers l'allemand : mots justes et bien placés, majuscules et trémas compris */
/* les nombres écrits en chiffres ou en lettres sont comparés à égalité */
const numW=t=>String(t).replace(/(\d)[.\s\u202f\u00a0](?=\d{3}(?!\d))/g,"$1").replace(/\d+/g,d=>d.length<=9?nz(+d):d);
function marksDe(input,ref,voice){
  const R=[];let stt=true;String(ref).trim().split(/\s+/).forEach(t=>{const c=clean(numW(t));if(!c){stt=true;return}R.push({raw:t,w:c,start:stt});stt=/[.!?:]$/.test(t)});
  const a=clean(numW(input)).split(" ").filter(Boolean),n=R.length,m=a.length;
  const eq=(x,r)=>x===r.w||((r.start||voice)&&x.slice(1)===r.w.slice(1)&&x[0].toLowerCase()===r.w[0].toLowerCase());
  const d=Array.from({length:n+1},()=>new Array(m+1).fill(0));
  for(let i=1;i<=n;i++)for(let j=1;j<=m;j++)d[i][j]=eq(a[j-1],R[i-1])?d[i-1][j-1]+1:Math.max(d[i-1][j],d[i][j-1]);
  let i=n,j=m;while(i>0&&j>0){if(eq(a[j-1],R[i-1])&&d[i][j]===d[i-1][j-1]+1){R[i-1].ok=1;i--;j--}else if(d[i-1][j]>=d[i][j-1])i--;else j--}
  return{score:Math.round(d[n][m]/Math.max(n,m,1)*100),html:R.map(r=>`<span class="${r.ok?"wg":"wb"}">${esc(r.raw)}</span>`).join(" ")};
}

/* ---------- composition des séries ---------- */
function unitSession(u){
  const pend=u.items.filter(it=>st(it).s<3);
  if(!pend.length)return unitPractice(u);
  const prog=pend.filter(it=>st(it).s>0).slice(0,S.set.per+2),fresh=pend.filter(it=>st(it).s===0).slice(0,Math.max(2,S.set.per-prog.length));
  const q=[],newW=fresh.filter(it=>it.t==="w"),inMatch=new Set();
  if(newW.length>=3){const k=Math.ceil(newW.length/Math.ceil(newW.length/5));
    for(let i=0;i<newW.length;i+=k){const ch=newW.slice(i,i+k);if(ch.length<3)break;ch.forEach(it=>inMatch.add(it));q.push({match:{title:"Nouveaux mots : relie chacun à sa traduction",say:"l",p:ch.map(it=>[it.de,it.fr,it])}})}}
  const nm=q.length;
  shuffle([...prog,...fresh]).forEach(it=>q.push(st(it).s===0&&(it.t==="s"||(it.t==="w"&&!inMatch.has(it)&&!it.rec))?{it,intro:1}:{it}));
  const n=S.ses[u.key]||0,mic=micMode()!=="none";S.ses[u.key]=n+1;
  if(mic){
    /* la prononciation est mêlée aux exercices : deux des nouveaux mots, et les mots-exemples de l'unité s'il y en a */
    shuffle(fresh.filter(it=>inMatch.has(it)&&speakable(it))).slice(0,2).forEach((it,k)=>q.splice(Math.min(q.length,nm+3+k*4),0,{speak:it}));
    u.items.filter(it=>it.t==="num"&&st(it).s<3).slice(0,2).forEach((it,k)=>{const x=pickNum(it);q.splice(Math.min(q.length,nm+4+k*4),0,{speak:{t:"w",de:nz(x),fr:""},show:fmtN(x),head:"Dis ce nombre en allemand"})});
    if(u.say&&u.say.length)[0,1].forEach(j=>{const p=u.say[(n*2+j)%u.say.length];q.splice(Math.min(q.length,nm+2+j*5),0,{speak:{t:"w",de:p[0],fr:p[1]}})});
  }
  if(u.match&&u.match.length){const m=u.match[n%u.match.length];q.splice(Math.min(q.length,6),0,{match:{title:m.t,say:m.say,p:m.p},free:1})}
  /* les mots qui ont une image : une ronde « relie chaque image à son mot » */
  const pics=shuffle(u.items.filter(it=>it.em&&(st(it).s>0||fresh.includes(it)))).slice(0,5);
  if(pics.length>=3)q.splice(Math.min(q.length,nm+5),0,{match:{title:"Relie chaque image à son mot",say:"r",pic:1,p:pics.map(it=>[it.em,it.de,it])},free:1});
  if(u.items.some(it=>it.t==="s")){q.push({bonus:"comp",u});if(mic)q.push({bonus:"speak",u})}
  run(q,{kind:"unit",u,full0:false,title:u.title,back:["unit",u.key]});
}
function unitPractice(u){

  const mic=micMode()!=="none",q=shuffle(u.items).map(it=>mic&&speakable(it)&&Math.random()<.2?{speak:it}:{it,force:"any"});

  if(mic&&u.say&&u.say.length){const p=pick(u.say);q.splice(Math.min(q.length,2),0,{speak:{t:"w",de:p[0],fr:p[1]}})}

function practice(L,mode){
  const w=L.items.filter(it=>it.t==="w"&&!it.rec),s=L.items.filter(it=>it.t==="s"),g=L.items.filter(it=>it.t==="g"||it.t==="r"||it.t==="num");let q=[];

    $("#back").onclick=()=>go("train");return;
  }
  /* Écouter : deux documents sonores avec leurs questions, puis comprendre et écrire ce qu'on entend */
  if(mode==="eco"){

    rest.forEach((c,i)=>{q.push(c);if(i===1&&H[0])q.push(H[0]);if(i===5&&H[1])q.push(H[1])});H.forEach(h=>{if(!q.includes(h))q.push(h)});
  }
  /* Parler : des phrases et des mots notés au micro, puis un texte à lire à voix haute, phrase par phrase */
  if(mode==="pro"){
    q=shuffle([...shuffle(s).slice(0,5),...shuffle(w.filter(speakable)).slice(0,2)]).map(it=>({speak:it}));
    const t=shuffle(L.tx||[])[0];
    if(t){const ss=t.de.split(/(?<=[.!?])\s+/).map(x=>x.replace(/^–\s*/,"").trim()).filter(x=>toks(x).length>=2);ss.forEach((x,k)=>q.push({speak:{t:"s",de:x,fr:""},read:1,head:`Lecture à voix haute · phrase ${k+1} sur ${ss.length}`}))}

  if(mode==="gra"){
    q=shuffle(g).slice(0,9).map(it=>({it,force:"type"}));
    const qa=shuffle(L.qa||[])[0];if(qa)q.splice(Math.min(q.length,4),0,{match:{title:"Relie chaque question à sa réponse",say:"lr",p:qa},free:1});
    shuffle(L.dialogs||[]).slice(0,2).forEach(d=>q.push({ex:seqEx(d)}));
  }

function settle(c,ok){

  const gens=L.items.filter(it=>it.t==="num"),nums=shuffle([...W.filter(isNum).map(it=>+it.fr),...gens.flatMap(it=>[pickNum(it),pickNum(it)])]).filter((n,i,a)=>a.indexOf(n)===i);
  add("w","Schreiben Sie die Zahlen.","Écris chaque nombre en chiffres.",nums.slice(0,N(5,4)).map(n=>({k:"in",pre:esc(nz(n))+" = ___",a:[String(n),fmtN(n)],mode:"loose"})));
  if(gens.length)add("w","Schreiben Sie die Zahlen in Wörtern.","Écris chaque nombre en toutes lettres.",nums.slice(5,5+N(4,3)).filter(n=>n<1e6).map(n=>({k:"in",wide:1,pre:esc(fmtN(n))+" = ___",a:numForms(n),mode:"loose"})));
  /* Strukturen 1 : compléter avec les formes d'un encadré (une même famille de formes, donc une seule réponse possible) */
  /* une indication allemande entre parenthèses (infinitif, adjectif, pronom, date) est permise, comme dans le cahier ; une précision en français (elle, ils…) écarte la phrase */
  const clean1=it=>it.c.filter(c=>!/→/.test(c[0])&&(!/\(/.test(c[0])||/^[^()]*\((?!(?:elle|elles|il|ils|vous|nous|tu|je|on)\))(?:Sie|[a-zäöüß]+|\d+\.)\)$/.test(c[0].trim()))),fam={},glo=c=>L.n>3&&!L.cur&&c[1]?`<small class="gl">${esc(c[1])}</small>`:"";
  G.filter(it=>clean1(it).length&&!it.id.startsWith("g-perf")).forEach(it=>{const k=[it.a,...it.o].sort().join("|");(fam[k]=fam[k]||[]).push(it)});
  const fams=shuffle(Object.values(fam).filter(f=>new Set(f.map(it=>it.a)).size>=3)).slice(0,N(2,1)),inFam=new Set();
  fams.forEach(f=>{const by={};f.forEach(it=>{by[it.a]=by[it.a]||it});const its=shuffle(Object.values(by)).slice(0,5),box=shuffle([...new Set([its[0].a,...its[0].o])]);its.forEach(it=>inFam.add(it));
    add("s","Ergänzen Sie.","Complète avec la bonne forme de l’encadré.",its.map(it=>{const c=pick(clean1(it));return{k:"sel",pre:esc(c[0])+glo(c),opts:box,a:it.a}}),{box})});
  /* Strukturen 2 : cocher la bonne forme */
  const s2=G.filter(it=>!inFam.has(it)&&clean1(it).length&&!it.id.startsWith("g-perf")).slice(0,N(6,4));
  add("s","Was ist richtig? Kreuzen Sie an.","Coche la bonne forme.",s2.map(it=>{const c=pick(clean1(it));return{k:"mc",q:esc(c[0])+glo(c),opts:shuffle([it.a,...it.o]),a:it.a}}));
  /* Strukturen 3 : construire des phrases en touchant les mots dans l'ordre */
  const low=new Set();L.items.forEach(it=>{[it.de||"",it.a||"",...(it.c||[]).map(c=>c[0])].forEach(x=>toks(x).forEach(t=>{if(t&&t[0]===t[0].toLowerCase())low.add(t)}))});
  const s3=Sx.filter(it=>{const t=toks(it.de);return t.length>=3&&t.length<=7&&!/[.!?]\s+\S|–|,/.test(it.de.trim())}).slice(0,N(4,3));
  add("s","Schreiben Sie Sätze. Ordnen Sie die Wörter.","Touche les mots dans le bon ordre pour construire la phrase.",s3.map(it=>{const t=toks(it.de),f=t[0].toLowerCase();if(low.has(f))t[0]=f;return ordItem(t,{say:"w",full:it.de,end:(it.de.trim().match(/[.!?]$/)||["."])[0]})}));
  /* Strukturen 4 : le passé composé des verbes, à partir de la leçon 11 */
  const pf=G.filter(it=>it.id.startsWith("g-perf")).slice(0,N(5,4));
  add("s","Wie heißt das Perfekt? Ergänzen Sie.","Écris le passé composé : l’auxiliaire et le participe.",pf.map(it=>({k:"in",pre:esc(it.c[0][0].split(" → ")[0])+" → ___",a:[it.a],mode:"strict"})));
  /* Kommunikation : question et réponse, puis la question qui convient, puis un dialogue à remettre en ordre */
  const qa=shuffle(L.qa||[]);
  if(qa[0]){const rs=shuffle(qa[0].map(p=>p[1]));add("k","Was passt? Ordnen Sie zu.","Associe chaque question à sa réponse.",qa[0].map(p=>({k:"sel",pre:esc(p[0])+" → ___",opts:rs,a:p[1]})))}
  const q2=qa[1]||qa[0];
  if(q2&&q2.length>=3)add("k","Welche Frage passt? Kreuzen Sie an.","Coche la question qui correspond à la réponse.",shuffle(q2).slice(0,4).map(p=>({k:"mc",q:"___ – "+esc(p[1]),opts:shuffle([p[0],...shuffle(q2.filter(x=>x!==p).map(x=>x[0])).slice(0,2)]),a:p[0]})));
  const ds=shuffle(L.dialogs||[]).slice(0,N(2,1));
  if(ds.length)T_.push({sec:"k",instr:"Ordnen Sie das Gespräch.",fr:"Touche les répliques dans l’ordre du dialogue.",items:ds.map(d=>ordItem(d,{block:1,each:1,say:"l",join:" – "}))});
  /* Lesen, puis Hören */
  shuffle(L.lesen||[]).slice(0,N(2,1)).forEach(r=>T_.push(lesenAuf(r)));
  if(audioOK())shuffle(L.hoer||[]).slice(0,N(2,1)).forEach(p=>T_.push(hoerAuf(p)));
  const order={w:0,s:1,k:2,l:3,h:4};T_.sort((a,b)=>order[a.sec]-order[b.sec]);
  return T_;
}

  <button class="btn" id="go">Commencer</button>`;

function startTest(L,mode){
  T={L,mode,auf:[],ans:[],lis:[],i:0,end:Date.now()+(mode==="full"?30:15)*6e4,tick:null};
  T.auf=buildTest(L,mode);T.ans=T.auf.map(a=>a.items.map(()=>null));T.lis=T.auf.map(()=>({n:0}));
  T.tick=setInterval(()=>{if(!T)return;const el=$("#tm0"),left=Math.max(0,T.end-Date.now());if(el)el.textContent=Math.floor(left/6e4)+":"+String(Math.floor(left/1e3)%60).padStart(2,"0");if(left<=0)finishTest()},500);
  showTestA();
}

  $("#pv").onclick=()=>{T.i--;showTestA()};$("#nx").onclick=()=>{if(last)finishTest();else{T.i++;showTestA()}};

function finishTest(){

  if($("#re"))$("#re").onclick=()=>startTest(L,"full");$("#hm").onclick=()=>go(full?"home":"train");
